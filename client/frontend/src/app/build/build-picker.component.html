<main class="xp" [class.embedded]="embedded">
  <!-- section heading: what a Villa is -->
  <div class="xp-intro">
    <h1 class="xp-title">Villa</h1>
    <p class="xp-def">A curated basket of mutual funds you build toward with a monthly SIP — and can draw a rent-like income from later.</p>
  </div>

  <!-- the three tiers, all on one screen -->
  <div class="xp-tiles">
    <button class="tier" *ngFor="let it of items" type="button" (click)="buy(it.cost)">
      <span class="tier-art"><app-villa-art></app-villa-art></span>
      <span class="tier-body">
        <span class="tier-name">{{ it.name }}</span>
        <span class="tier-sip">SIP from <b>{{ compact(it.sipMonthly) }}/mo</b></span>
      </span>
      <span class="tier-cta">
        Start SIP
        <svg viewBox="0 0 24 24" width="15" height="15" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
    </button>
  </div>

  <!-- reassurance: you don't need the full amount to start -->
  <div class="xp-note">
    <span class="xp-note-ic" aria-hidden="true">💡</span>
    <p class="xp-note-txt">
      Don’t have ₹10 L? No worries. Start a SIP of just
      <b>₹10,000 a month</b> and earn a proportional income every month as your villa grows.
    </p>
  </div>

  <app-mf-disclaimer [compact]="true"></app-mf-disclaimer>
</main>
