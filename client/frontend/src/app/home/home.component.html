<main class="home" *ngIf="est.tiles().length < 2">
  <!-- shared shell: greeting + avatar -->
  <header class="hm-top">
    <div class="hm-greet">
      <span class="hm-hi">{{ greeting }}</span>
      <b class="hm-name">{{ name || 'Welcome' }}</b>
    </div>
    <button class="hm-avatar" (click)="account.emit()" aria-label="Account">
      <img *ngIf="photo" [src]="photo" alt="" />
      <span *ngIf="!photo">{{ initial }}</span>
    </button>
  </header>

  <!-- shared 3-step rail — the journey, with today's stage lit -->
  <nav class="hm-rail" aria-label="Your journey">
    <div class="hm-step" *ngFor="let s of STEPS; let i = index"
         [class.done]="isDone(i)" [class.on]="isActive(i)">
      <span class="hm-node">
        <svg *ngIf="isDone(i)" viewBox="0 0 24 24" width="13" height="13" aria-hidden="true">
          <path d="M5 13l4 4 10-11" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linecap="round" stroke-linejoin="round"/>
        </svg>
        <span *ngIf="!isDone(i)">{{ i + 1 }}</span>
      </span>
      <span class="hm-step-lbl">{{ s.label }}</span>
    </div>
  </nav>

  <!-- ===== the body: one of three templates, chosen by real state ===== -->
  <section class="hm-body">
    <!-- 1 · CALL — book / see the setup call -->
    <app-onboarding-home *ngIf="stage() === 'call'" [embedded]="true"
      [justVerified]="justVerified" (refresh)="refresh.emit()"></app-onboarding-home>

    <!-- 2 · SIP — watch the SIP fill the villa up -->
    <app-single-estate *ngIf="stage() === 'sip'" [embedded]="true"
      (openTile)="openTile.emit($event)"></app-single-estate>

    <!-- 3 · VILLA — the built single villa (grown) -->
    <app-single-estate *ngIf="stage() === 'villa'" [embedded]="true"
      (openTile)="openTile.emit($event)"></app-single-estate>
  </section>
</main>

<!-- 2+ holdings → the full estate map, its own full-screen surface -->
<app-estate-home *ngIf="est.tiles().length >= 2"
  (openTile)="openTile.emit($event)" (explore)="explore.emit()"
  (build)="build.emit()" (account)="account.emit()"></app-estate-home>
