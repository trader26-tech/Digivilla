<div class="intro" [class.entered]="entered" [style.--hue]="hue">
  <!-- soft colour wash -->
  <div class="wash" aria-hidden="true"></div>

  <header class="top">
    <button class="icon-btn" (click)="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="crumb">{{ goal.label }}</span>
    <span class="spacer"></span>
  </header>

  <!-- ===== signature hero, unique per goal ===== -->
  <div class="hero" [attr.data-hero]="cfg.hero">
    <div class="hero-disc">
      <svg viewBox="0 0 120 120" width="120" height="120" class="hero-svg">
        <ng-container [ngSwitch]="cfg.hero">
          <!-- shield (emergency) -->
          <g *ngSwitchCase="'shield'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 22l28 10v24c0 20-13 34-28 42-15-8-28-22-28-42V32z"/>
            <path d="M48 60l9 9 17-19"/>
          </g>
          <!-- heart pulse (health) -->
          <g *ngSwitchCase="'heart'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 92C34 74 24 60 24 46a18 18 0 0 1 36-6 18 18 0 0 1 36 6c0 14-10 28-36 46z"/>
            <path d="M40 58h10l6-12 8 20 6-8h10" stroke-width="4"/>
          </g>
          <!-- car -->
          <g *ngSwitchCase="'car'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M26 70l6-20a10 10 0 0 1 9-6h38a10 10 0 0 1 9 6l6 20"/>
            <rect x="22" y="70" width="76" height="18" rx="6"/>
            <circle cx="40" cy="90" r="6"/><circle cx="80" cy="90" r="6"/>
          </g>
          <!-- rings (wedding) -->
          <g *ngSwitchCase="'rings'" fill="none" stroke="currentColor" stroke-width="5">
            <circle cx="48" cy="66" r="22"/><circle cx="74" cy="66" r="22"/>
            <path d="M40 40l8-12 8 12z" stroke-width="4" stroke-linejoin="round"/>
          </g>
          <!-- plane (vacation) -->
          <g *ngSwitchCase="'plane'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M28 74l64-24c6-2 10 4 5 8L52 92l-6-14-18-4z"/>
            <path d="M52 92l-2-14"/>
          </g>
          <!-- sparkle (gadget / big purchase) -->
          <g *ngSwitchCase="'sparkle'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 26v20M60 74v20M26 60h20M74 60h20"/>
            <path d="M44 44l10 10M76 44l-10 10M44 76l10-10M76 76l-10-10" stroke-width="4"/>
          </g>
          <!-- house -->
          <g *ngSwitchCase="'house'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M30 60l30-26 30 26"/>
            <path d="M38 56v34h44V56"/>
            <path d="M54 90V70h12v20"/>
          </g>
          <!-- grad cap (education) -->
          <g *ngSwitchCase="'grad'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M22 52l38-16 38 16-38 16z"/>
            <path d="M40 60v18c0 6 40 6 40 0V60"/>
            <path d="M98 52v18"/>
          </g>
          <!-- palm (retirement) -->
          <g *ngSwitchCase="'palm'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M60 44v46"/>
            <path d="M60 44c-12-10-26-8-32 0 10-2 18 2 22 8M60 44c12-10 26-8 32 0-10-2-18 2-22 8M60 44c-4-12 2-22 0-24-2 2 4 12 0 24"/>
            <path d="M44 90h32" stroke-width="4"/>
          </g>
          <!-- growth (wealth) -->
          <g *ngSwitchCase="'growth'" fill="none" stroke="currentColor" stroke-width="5" stroke-linecap="round" stroke-linejoin="round">
            <path d="M28 84h64M34 84V66M50 84V54M66 84V44M82 84V32"/>
            <path d="M34 46l16-8 16 6 16-14" stroke-width="4"/>
          </g>
        </ng-container>
      </svg>
    </div>
    <span class="hero-emoji">{{ goal.icon }}</span>
  </div>

  <!-- ===== minimal copy ===== -->
  <h1 class="tagline">{{ cfg.tagline }}</h1>
  <p class="why">{{ cfg.why }}</p>

  <!-- ===== the mini-calculator ===== -->
  <div class="calc">
    <label class="calc-label">{{ cfg.inputLabel }}</label>
    <div class="calc-input">
      <button class="step" (click)="stepInput(-1)" aria-label="Less">−</button>
      <div class="field">
        <span class="pfx" *ngIf="cfg.inputPrefix">{{ cfg.inputPrefix }}</span>
        <input
          inputmode="numeric"
          [value]="inputDisplay"
          (input)="onInputText($any($event.target).value)"
          [attr.aria-label]="cfg.inputLabel"
        />
        <span class="sfx" *ngIf="cfg.inputSuffix">{{ cfg.inputSuffix }}</span>
      </div>
      <button class="step" (click)="stepInput(1)" aria-label="More">+</button>
    </div>

    <div class="calc-arrow">
      <span class="rule">{{ cfg.ruleText }}</span>
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M12 5v14M6 13l6 6 6-6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </div>

    <div class="result">
      <span class="r-label">We suggest starting at</span>
      <div class="r-amount">{{ compactInr(recommended) }}</div>
      <span class="r-full">₹{{ recommended | number:'1.0-0' }}</span>
    </div>
  </div>

  <button class="continue" (click)="continue()">
    Continue
    <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
  </button>
  <p class="adjust-note">You can fine-tune this on the next screen.</p>
</div>
