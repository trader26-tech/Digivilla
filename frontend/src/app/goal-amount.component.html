<div class="amount-screen" [class.entered]="entered" [style.--hue]="hue">
  <!-- Top bar -->
  <header class="top">
    <div class="goal-chip">
      <span class="g-emoji">{{ goal.icon }}</span>
      <span class="g-label">{{ goal.label }}</span>
    </div>
    <button class="icon-btn" (click)="goBack()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <h1 class="prompt reveal">Please choose a goal amount</h1>

  <!-- Big amount -->
  <div class="readout reveal">
    <div class="big" [class.pop]="popKey % 2 === 0" [class.pop2]="popKey % 2 === 1">{{ full }}</div>
    <div class="compact">{{ compact }}</div>
  </div>

  <!-- Enter amount pill -->
  <button class="enter-btn reveal" (click)="openDialer()">
    <svg viewBox="0 0 24 24" width="15" height="15"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    Enter amount
  </button>

  <!-- ===================== The arch dial ===================== -->
  <div
    class="dial"
    [class.dragging]="isDragging"
    #dial
    (pointerdown)="startDrag($event)"
    role="slider"
    [attr.aria-valuemin]="min"
    [attr.aria-valuemax]="max"
    [attr.aria-valuenow]="amount"
    [attr.aria-label]="'Goal amount for ' + goal.label"
  >
    <!-- viewBox is a wide, short band; the dial is a big circle whose TOP edge
         arcs across it, centre pushed below the band so only the top cap shows. -->
    <svg viewBox="0 0 320 220" class="dial-svg" preserveAspectRatio="xMidYMin slice">
      <defs>
        <!-- Colour gradient for the filled arc, in the goal's hue. -->
        <linearGradient id="arcFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   [attr.stop-color]="'hsl(' + hue + ' 90% 62%)'" />
          <stop offset="100%" [attr.stop-color]="'hsl(' + (hue + 26) + ' 88% 52%)'" />
        </linearGradient>
        <!-- A drifting sheen overlaid on the fill so the arc always shimmers. -->
        <linearGradient id="arcSheen" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"  stop-color="#fff" stop-opacity="0" />
          <stop offset="50%" stop-color="#fff" stop-opacity="0.55" />
          <stop offset="100%" stop-color="#fff" stop-opacity="0" />
        </linearGradient>
        <radialGradient id="domeGlow" cx="50%" cy="18%" r="80%">
          <stop offset="0%"  [attr.stop-color]="'hsl(' + hue + ' 85% 92%)'" />
          <stop offset="100%" [attr.stop-color]="'hsl(' + hue + ' 60% 98%)'" />
        </radialGradient>
        <filter id="arcGlow" x="-30%" y="-30%" width="160%" height="160%">
          <feGaussianBlur stdDeviation="4" result="b" />
          <feMerge><feMergeNode in="b" /><feMergeNode in="SourceGraphic" /></feMerge>
        </filter>
      </defs>

      <!-- The dome fill: a soft tinted wash instead of flat ash. -->
      <circle class="dome" cx="160" cy="320" r="300" fill="url(#domeGlow)" />

      <!-- Base track (faint, full arc) -->
      <path class="track" [attr.d]="arcPath(1)" />
      <!-- Coloured progress + a drifting sheen clipped to the same path -->
      <path class="progress" [attr.d]="arcPath(fraction)" pathLength="100" stroke="url(#arcFill)" filter="url(#arcGlow)" />
      <path class="sheen" [attr.d]="arcPath(fraction)" pathLength="100" stroke="url(#arcSheen)" />

      <!-- Handle: pulsing coloured glow + halo + solid knob -->
      <circle class="handle-glow" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="22"
              [attr.fill]="'hsl(' + hue + ' 90% 60%)'" />
      <circle class="handle-halo" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="15"
              [attr.fill]="'hsl(' + hue + ' 90% 60%)'" />
      <circle class="handle-ring" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="9"
              [attr.stroke]="'hsl(' + hue + ' 85% 48%)'" />
      <circle class="handle" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="6" />
    </svg>

    <!-- Suggestion chips float over the dome -->
    <div class="chips reveal">
      <button
        *ngFor="let s of goal.suggested_amounts"
        class="chip"
        [class.active]="amount === s"
        (click)="pickSuggested(s); $event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      >{{ compactInr(s) }}</button>
    </div>
  </div>

  <!-- Next -->
  <button class="next reveal" (click)="confirm()">Next</button>

  <!-- ===================== Numeric dialer overlay ===================== -->
  <div class="dialer-backdrop" *ngIf="dialerOpen" (click)="closeDialer(false)"></div>
  <div class="dialer" [class.open]="dialerOpen" *ngIf="dialerOpen">
    <div class="dialer-head">
      <button class="icon-btn" (click)="closeDialer(false)" aria-label="Back to dial">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span>Enter exact amount</span>
      <span class="spacer"></span>
    </div>

    <div class="dialer-display">
      <span class="cur">₹</span>{{ dialerDisplay }}
    </div>

    <div class="keypad">
      <button *ngFor="let k of ['1','2','3','4','5','6','7','8','9']" (click)="pressKey(k)">{{ k }}</button>
      <button (click)="pressKey('000')" class="wide">000</button>
      <button (click)="pressKey('0')">0</button>
      <button (click)="pressKey('back')" class="back" aria-label="Delete">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6h11v12H9l-6-6 6-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="dialer-done" (click)="closeDialer(true)">Set amount</button>
  </div>
</div>
