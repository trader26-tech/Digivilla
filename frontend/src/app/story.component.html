<section
  class="story"
  [style.--hue]="beat.hue"
  (click)="next()"
  (touchstart)="onTouchStart($event)"
  (touchend)="onTouchEnd($event)"
  tabindex="0"
>
  <!-- ambient tinted background, shifts with each beat's hue -->
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
  </div>

  <!-- top bar: progress + skip -->
  <header class="bar" (click)="$event.stopPropagation()">
    <div class="dots" role="tablist" aria-label="Intro progress">
      <span
        *ngFor="let b of beats; let i = index"
        class="dot"
        [class.on]="i === index"
        [class.past]="i < index"
      ></span>
    </div>
    <button class="skip" (click)="skip()" type="button">Skip</button>
  </header>

  <!-- Rupi + her speech bubble -->
  <div class="stage">
    <div class="bubble-wrap">
      <div
        class="bubble"
        [@bubbleSwap]="index"
      >
        {{ beat.line }}
        <span class="tail" aria-hidden="true"></span>
      </div>
    </div>

    <app-rupi class="mascot" [pose]="beat.pose" [size]="180"></app-rupi>
  </div>

  <!-- bottom CTA -->
  <footer class="foot" (click)="$event.stopPropagation()">
    <button class="cta" (click)="next()" type="button">
      <span>{{ isLast ? 'Choose my goal' : 'Next' }}</span>
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <span class="hint">Tap anywhere to continue</span>
  </footer>
</section>
