<!doctype html><html><head><meta charset="utf-8">
<!-- TheDigiCiti app icon. Render .ic at 1024x1024 (icon.html = "any", body.mask = maskable safe zone). -->
<style>
html,body{margin:0;background:transparent}
.ic{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:
    radial-gradient(560px 300px at 50% 70%, rgba(108,186,54,.42), transparent 70%),
    radial-gradient(300px 240px at 50% 17%, rgba(246,196,69,.42), transparent 70%),
    radial-gradient(900px 760px at 50% 6%, #3d3c94 0%, #25265f 36%, #131537 66%, #0a0b1c 100%);}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 17%, rgba(255,255,255,.055) 0 6deg, transparent 6deg 18deg);
  -webkit-mask:radial-gradient(360px 360px at 50% 17%, #000 0%, transparent 75%);mask:radial-gradient(360px 360px at 50% 17%, #000 0%, transparent 75%)}
.stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;box-shadow:0 0 10px 2px rgba(255,255,255,.5)}
.art{position:absolute;inset:0}
.mask .art{transform:scale(.8);transform-origin:50% 54%}
.ground{position:absolute;left:50%;top:784px;width:820px;height:150px;margin-left:-410px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.5),transparent)}
.villa{position:absolute;left:50%;top:252px;width:860px;margin-left:-430px;filter:drop-shadow(0 34px 30px rgba(0,0,0,.5))}
.coin{position:absolute;left:50%;top:80px;width:150px;margin-left:-75px;filter:drop-shadow(0 0 30px rgba(246,196,69,.85)) drop-shadow(0 10px 12px rgba(0,0,0,.35))}
</style></head><body><div class="ic">
<div class="rays"></div>
<div class="stars"><i style="left:140px;top:150px"></i><i style="left:870px;top:190px;width:4px;height:4px"></i><i style="left:230px;top:330px;width:4px;height:4px;opacity:.5"></i><i style="left:790px;top:360px;width:5px;height:5px;opacity:.55"></i><i style="left:320px;top:80px;width:3px;height:3px"></i><i style="left:710px;top:96px;width:4px;height:4px"></i></div>
<div class="art"><div class="ground"></div>
<img class="villa" src="villa-icon.svg"><img class="coin" src="coin-icon.svg"></div>
</div></body></html>
