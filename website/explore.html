/* ── EXPLORE (phones) · the "Return & risk" lesson, 9 steps, then the calculator full-screen ────
   Ported from the explore-flow handoff (Story Mobile.html). Same look and timing; built to stay
   smooth on any phone: the hand-drawn look is BAKED into the path data once at mount (no SVG
   displacement filter re-rendering while the pen draws), glows are radial gradients (no Gaussian
   blur, no drop-shadows), nothing uses backdrop-filter, every move is opacity/transform or a
   stroke-dashoffset draw. One tap or one swipe = one step; the card and the graph both advance.
   Step 9's CTA (or Skip) opens THE calculator (the landing's #calculator — there is only one): its ink grows from the tap; the app's
   engine on real history, every control on one screen, nothing to scroll. */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0c12}
.xpl{position:fixed;inset:0;overflow:hidden;color:#fff6ea;font-family:Inter,system-ui,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;-webkit-tap-highlight-color:transparent;overscroll-behavior:none;background:radial-gradient(ellipse 70% 40% at 50% 34%,rgba(246,196,69,.12),transparent 70%),radial-gradient(ellipse 80% 30% at 50% 100%,rgba(42,43,107,.55),transparent 70%),linear-gradient(180deg,#0c0e24,#0a0b16)}
.xpl *{box-sizing:border-box}
.xpl-lesson{position:absolute;inset:0;touch-action:none;transition:transform .55s cubic-bezier(.2,.8,.2,1),opacity .45s ease;will-change:transform}
.xpl-lesson.away{transform:scale(.96);opacity:.6;pointer-events:none}
.xpl-grid{position:absolute;inset:0;pointer-events:none;background-image:radial-gradient(rgba(255,236,190,.14) 1px,transparent 1.2px);background-size:24px 24px;-webkit-mask-image:radial-gradient(ellipse 80% 55% at 50% 38%,#000 35%,transparent 95%);mask-image:radial-gradient(ellipse 80% 55% at 50% 38%,#000 35%,transparent 95%)}
.xpl-col{position:relative;height:100%;max-width:480px;margin:0 auto;display:flex;flex-direction:column;padding:max(12px,env(safe-area-inset-top)) 16px max(14px,env(safe-area-inset-bottom))}
.xpl-head{flex:none;display:flex;justify-content:space-between;align-items:center;gap:12px}
.xpl-pill{display:flex;align-items:center;height:44px;border-radius:999px;border:0;font:inherit;cursor:pointer;color:#E1E0CC;text-decoration:none;-webkit-user-select:none;user-select:none}
.xpl-back{gap:10px;padding:0 14px 0 5px;background:rgba(11,12,18,.62);box-shadow:inset 0 0 0 1px rgba(255,236,200,.18);font-size:14px;font-weight:600;letter-spacing:-.01em}
.xpl-back i{width:34px;height:34px;border-radius:50%;display:grid;place-items:center;background:#E1E0CC;color:#0b0c12}
.xpl-skip{padding:0 16px;background:transparent;font-size:13px;font-weight:500;color:rgba(225,224,204,.8);box-shadow:inset 0 0 0 1px rgba(225,224,204,.18)}
.xpl-prog{flex:none;display:flex;gap:5px;margin-top:14px}
.xpl-prog>span{flex:1;height:3px;border-radius:2px;background:rgba(255,255,255,.12);transition:background .4s}
.xpl-prog>span.done{background:rgba(246,196,69,.45)}.xpl-prog>span.on{background:#f6c445}
.xpl-graph{flex:1;min-height:0;position:relative;cursor:pointer}
.xpl-svg{position:absolute;left:0;top:10px;width:100%;height:calc(100% - 20px);overflow:visible}
.xpl-svg [data-in]{opacity:0}
.xpl-svg .pen{stroke-dasharray:1;stroke-dashoffset:1}
.xpl-svg [data-pop]{transform-box:fill-box;transform-origin:center;transform:scale(.4)}
.xpl-svg [data-dim]{transition:opacity .6s ease}
.xpl-svg text{font-family:Caveat,cursive;font-weight:700;pointer-events:none}
.xpl-card{flex:none;position:relative;height:clamp(190px,28svh,212px);display:flex;flex-direction:column;padding:22px 22px 16px;border-radius:26px;background:linear-gradient(180deg,rgba(255,244,222,.07),rgba(255,226,186,.03)),rgba(18,19,32,.9);box-shadow:inset 0 0 0 1px rgba(255,236,200,.14),0 30px 60px -30px rgba(0,0,0,.8);cursor:pointer;-webkit-user-select:none;user-select:none}
.xpl-caps{position:relative;flex:1}
.xpl-cap{position:absolute;inset:0;display:flex;flex-direction:column;gap:8px;opacity:0;transform:translateY(14px);transition:opacity .4s ease,transform .5s cubic-bezier(.2,.8,.2,1);pointer-events:none}
.xpl-cap.c0{justify-content:center;align-items:center}
.xpl-cap.before{transform:translateY(-14px)}
.xpl-cap.on{opacity:1;transform:none;pointer-events:auto}
.xpl-cap .k{font-size:11px;font-weight:600;letter-spacing:.28em;text-transform:uppercase;color:#f6c445}
.xpl-cap .k.red{color:#e2725b}.xpl-cap .k.grn{color:#8fd65a}
.xpl-cap .h{font-size:26px;font-weight:600;letter-spacing:-.035em;line-height:1.14;text-wrap:balance}
.xpl-cap .h.big{font-size:30px;letter-spacing:-.04em;line-height:1.1}
.xpl-cap .b{font-size:15px;line-height:1.45;color:rgba(255,246,234,.7)}
.xpl-cap .list{display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.35;color:rgba(255,246,234,.75)}
.xpl-cap .list b{font-weight:600}.xpl-cap .g{color:#8fd65a}.xpl-cap .r{color:#e2725b}
.xpl-cap .tick{display:flex;flex-direction:column;gap:5px;font-size:14.5px;line-height:1.35;color:#fff6ea}.xpl-cap .tick>span{display:flex;gap:10px}.xpl-cap .tick b{font-weight:600}
.xpl-title{font-family:Caveat,cursive;font-size:34px;font-weight:700;color:#fbdb81}
.xpl-cta{margin-top:auto;display:flex;align-items:center;justify-content:space-between;height:52px;padding:0 6px 0 20px;border-radius:999px;border:0;font:inherit;cursor:pointer;background:#E1E0CC;color:#0b0c12;font-size:15px;font-weight:600;text-decoration:none;box-shadow:0 0 30px rgba(255,214,150,.35);animation:xplGlow 2.4s ease-in-out infinite}
.xpl-cta i{width:40px;height:40px;border-radius:50%;display:grid;place-items:center;background:#0b0c12;color:#E1E0CC}
.xpl-foot{flex:none;display:flex;justify-content:space-between;align-items:center;padding-top:10px;font-size:11px;letter-spacing:.24em;text-transform:uppercase;color:rgba(225,224,204,.5);transition:opacity .3s}
.xpl-foot .sw{display:flex;align-items:center;gap:6px}
.xpl-foot .sw svg{animation:xplBob 2.2s ease-in-out infinite}
@keyframes xplBob{0%,100%{transform:translateY(1px)}50%{transform:translateY(-3px)}}
@keyframes xplGlow{0%,100%{box-shadow:0 0 22px rgba(255,214,150,.28)}50%{box-shadow:0 0 36px rgba(255,214,150,.5)}}
.xpl-calc{position:fixed;inset:0;z-index:20;--pvh:100%;background:#0b0c12;transform:translate3d(0,100%,0);visibility:hidden;will-change:transform;transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s linear .55s}
.xpl-calc.open{transform:none;visibility:visible;transition:transform .55s cubic-bezier(.2,.8,.2,1),visibility 0s}
.xpl-calc>.sc-host{height:100%}
@media (prefers-reduced-motion:reduce){.xpl-lesson,.xpl-cap,.xpl-calc,.xpl-prog>span{transition:none}.xpl-foot .sw svg,.xpl-cta{animation:none}}
</style>
