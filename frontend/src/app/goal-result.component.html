<div class="result-screen" [class.entered]="entered" [style.--hue]="hue">
  <button class="back" (click)="goBack()" aria-label="Back">←</button>

  <!-- ONE focal point: the monthly amount -->
  <div class="hero">
    <div class="sip">{{ compactInr(monthlySip) }}<span class="per">/mo</span></div>
    <p class="sip-sub">to reach {{ compactInr(amount) }}</p>
  </div>

  <!-- Visual split: you invest vs funds grow. Almost no words. -->
  <div class="donut">
    <svg viewBox="0 0 120 120">
      <circle cx="60" cy="60" [attr.r]="ringR" class="rim-base" />
      <circle cx="60" cy="60" [attr.r]="ringR" class="rim invested"
        [attr.stroke-dasharray]="investedDash" stroke-dashoffset="0" transform="rotate(-90 60 60)" />
      <circle cx="60" cy="60" [attr.r]="ringR" class="rim growth"
        [attr.stroke-dasharray]="growthDash" [attr.stroke-dashoffset]="growthOffset" transform="rotate(-90 60 60)" />
    </svg>
    <div class="donut-center">
      <span class="dc-grow">+{{ compactInr(growth) }}</span>
      <span class="dc-label">funds add</span>
    </div>
  </div>

  <div class="mini-legend">
    <span><i class="d-inv"></i>You put in {{ compactInr(totalInvested) }}</span>
    <span><i class="d-grw"></i>Funds add {{ compactInr(growth) }}</span>
  </div>

  <button class="cta" (click)="proceed()">Start investing →</button>

  <!-- Understated reveal, out of the way -->
  <button class="reveal-link" (click)="toggleFunds()">
    {{ showFunds ? 'Hide funds' : 'Where does it go?' }}
  </button>

  <!-- Fund detail (hidden by default) -->
  <div class="funds-panel" *ngIf="showFunds">
    <div class="loading" *ngIf="loadingFunds">Loading…</div>
    <ng-container *ngIf="basket as b">
      <div class="alloc-bar">
        <span *ngFor="let s of allocSlices" [style.width.%]="s.pct" [style.background]="assetColor(s.kind)" [title]="s.label"></span>
      </div>
      <div class="alloc-legend">
        <span *ngFor="let s of allocSlices"><i [style.background]="assetColor(s.kind)"></i>{{ s.pct }}% {{ s.label }}</span>
      </div>
      <div class="fund-list">
        <div class="fund" *ngFor="let f of funds">
          <span class="f-dot" [style.background]="assetColor(f.asset_class)"></span>
          <span class="f-name">{{ f.name }}</span>
          <span class="f-wt">{{ (f.weight * 100).toFixed(0) }}%</span>
        </div>
      </div>
    </ng-container>
  </div>
</div>
