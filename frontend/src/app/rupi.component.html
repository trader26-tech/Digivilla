<div
  class="rupi"
  [class.animated]="animated"
  [attr.data-pose]="pose"
  [style.width.px]="size"
  [style.height.px]="size"
>
  <svg viewBox="0 0 140 140" fill="none" aria-hidden="true">
    <defs>
      <radialGradient id="rupi-face" cx="38%" cy="30%" r="82%">
        <stop offset="0" stop-color="#f6d492" />
        <stop offset="52%" stop-color="#e6b855" />
        <stop offset="100%" stop-color="#c8951f" />
      </radialGradient>
      <linearGradient id="rupi-rim" x1="0.2" y1="0" x2="0.7" y2="1">
        <stop offset="0" stop-color="#eecb6f" />
        <stop offset="50%" stop-color="#d3a238" />
        <stop offset="100%" stop-color="#a67813" />
      </linearGradient>
      <filter id="rupi-drop" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="5" stdDeviation="5.5" flood-color="#9c6d0e" flood-opacity="0.32" />
      </filter>
    </defs>

    <!-- soft ground shadow -->
    <ellipse class="ground" cx="70" cy="131" rx="27" ry="5" fill="#000" opacity="0.11" />

    <!-- ARMS (behind body): forearm + rounded hand -->
    <g class="arm arm-l">
      <path class="forearm" d="M40 86 Q23 84 17 70" stroke="#e0971a" stroke-width="7.5" stroke-linecap="round" fill="none" />
      <circle class="hand" cx="16" cy="68" r="7.5" fill="#f8c948" />
    </g>
    <g class="arm arm-r">
      <path class="forearm" d="M100 86 Q117 84 123 70" stroke="#e0971a" stroke-width="7.5" stroke-linecap="round" fill="none" />
      <circle class="hand" cx="124" cy="68" r="7.5" fill="#f8c948" />
    </g>

    <!-- COIN body -->
    <g class="body" filter="url(#rupi-drop)">
      <circle cx="70" cy="70" r="47" fill="url(#rupi-rim)" />
      <circle cx="70" cy="70" r="39" fill="url(#rupi-face)" />
      <!-- gentle top sheen, mellow -->
      <ellipse class="sheen" cx="58" cy="49" rx="18" ry="9" fill="#fff" opacity="0.14" />
    </g>

    <!-- FACE -->
    <g class="face">
      <!-- eyebrows: calm, gentle, level — friendly & smart, not cocky -->
      <g class="brows" stroke="#5a3f10" stroke-width="3" stroke-linecap="round" fill="none">
        <path class="brow brow-l" d="M51 55 Q58 53 64 55" />
        <path class="brow brow-r" d="M76 55 Q82 53 89 55" />
      </g>

      <!-- eyes: calm, one soft highlight -->
      <g class="eyes">
        <g class="eye eye-l">
          <ellipse class="ball" cx="57" cy="66" rx="5.4" ry="6.2" fill="#4a3410" />
          <circle class="spark" cx="58.8" cy="64" r="1.7" fill="#fff" opacity="0.85" />
        </g>
        <g class="eye eye-r">
          <ellipse class="ball" cx="83" cy="66" rx="5.4" ry="6.2" fill="#4a3410" />
          <circle class="spark" cx="84.8" cy="64" r="1.7" fill="#fff" opacity="0.85" />
        </g>
        <!-- blink lids -->
        <g class="lids" fill="url(#rupi-face)">
          <rect class="lid lid-l" x="50" y="59" width="14" height="8" rx="4" />
          <rect class="lid lid-r" x="76" y="59" width="14" height="8" rx="4" />
        </g>
      </g>

      <!-- mouth: a calm, warm smile -->
      <path class="mouth" d="M59 80 Q70 89 81 80" stroke="#5a3f10" stroke-width="3.4" stroke-linecap="round" fill="none" />
    </g>
  </svg>
</div>
