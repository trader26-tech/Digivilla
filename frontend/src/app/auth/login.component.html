<main class="login">
  <!-- STEP 1 · phone -->
  <form *ngIf="step() === 'phone'" class="lg-flow" (ngSubmit)="sendCode()" novalidate>
    <!-- top: title -->
    <header class="lg-top">
      <h1 class="lg-title">Sign in or create<br>your account</h1>
      <p class="lg-sub">Enter your phone to continue.</p>
    </header>

    <!-- middle: fields -->
    <div class="lg-mid">
      <label class="lg-field">
        <span class="lg-lbl">Phone number</span>
        <div class="lg-phone">
          <span class="lg-cc">🇮🇳 +91</span>
          <input class="lg-input bare" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10"
                 placeholder="98765 43210"
                 [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" />
        </div>
      </label>

      <p class="lg-err" *ngIf="error()">{{ error() }}</p>
    </div>

    <!-- bottom: the action -->
    <footer class="lg-bottom">
      <button class="lg-btn" type="submit" [disabled]="!phoneValid || busy()">
        <span *ngIf="!busy()">Get verification code</span>
        <span *ngIf="busy()" class="lg-spin" aria-hidden="true"></span>
      </button>
      <p class="lg-fine">
        We’ll text a 6-digit code to verify it’s you.
        <span *ngIf="!firebaseReady" class="lg-dev">Dev mode — use 123456.</span>
      </p>
    </footer>
  </form>

  <!-- STEP 2 · OTP -->
  <form *ngIf="step() === 'otp'" class="lg-flow" (ngSubmit)="verify()" novalidate>
    <!-- top: title -->
    <header class="lg-top">
      <button class="lg-edit" type="button" (click)="editPhone()">
        <svg viewBox="0 0 24 24" width="16" height="16"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
        +91 {{ phone() }}
      </button>
      <h1 class="lg-title">Enter the code</h1>
      <p class="lg-sub">Sent to your phone by SMS.</p>
    </header>

    <!-- middle: the code -->
    <div class="lg-mid">
      <input class="lg-otp" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
             placeholder="––––––" [ngModel]="code()" (ngModelChange)="code.set($event)" name="code" />
      <p class="lg-err" *ngIf="error()">{{ error() }}</p>
    </div>

    <!-- bottom: the action -->
    <footer class="lg-bottom">
      <button class="lg-btn" type="submit" [disabled]="!codeValid || busy()">
        <span *ngIf="!busy()">Verify</span>
        <span *ngIf="busy()" class="lg-spin" aria-hidden="true"></span>
      </button>
      <button class="lg-resend" type="button" (click)="resend()">Didn’t get it? <b>Resend</b></button>
    </footer>
  </form>

  <!-- STEP 3 · details (new users, after OTP) -->
  <form *ngIf="step() === 'details'" class="lg-flow" (ngSubmit)="saveDetails()" novalidate>
    <header class="lg-top">
      <h1 class="lg-title">A few details</h1>
      <p class="lg-sub">So we can set up your account.</p>
    </header>

    <div class="lg-mid">
      <label class="lg-field">
        <span class="lg-lbl">Full name</span>
        <input class="lg-input" type="text" autocomplete="name" placeholder="Sanjeev Ramprasad"
               [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" />
      </label>
      <label class="lg-field">
        <span class="lg-lbl">Email</span>
        <input class="lg-input" type="email" autocomplete="email" placeholder="you@email.com"
               [ngModel]="email()" (ngModelChange)="email.set($event)" name="email" />
      </label>
      <div class="lg-row">
        <label class="lg-field">
          <span class="lg-lbl">Age</span>
          <input class="lg-input" type="tel" inputmode="numeric" maxlength="3" placeholder="32"
                 [ngModel]="age()" (ngModelChange)="age.set($event)" name="age" />
        </label>
        <label class="lg-field grow">
          <span class="lg-lbl">City</span>
          <input class="lg-input" type="text" autocomplete="address-level2" placeholder="Chennai"
                 [ngModel]="city()" (ngModelChange)="city.set($event)" name="city" />
        </label>
      </div>
      <p class="lg-err" *ngIf="error()">{{ error() }}</p>
    </div>

    <footer class="lg-bottom">
      <button class="lg-btn" type="submit" [disabled]="!detailsValid || busy()">
        <span *ngIf="!busy()">Enter PropertyNest</span>
        <span *ngIf="busy()" class="lg-spin" aria-hidden="true"></span>
      </button>
    </footer>
  </form>

  <!-- invisible reCAPTCHA mount for Firebase phone auth -->
  <div id="recaptcha-container"></div>
</main>
