<div
  class="rupi"
  [class.animated]="animated"
  [attr.data-pose]="pose"
  [style.width.px]="size"
  [style.height.px]="size"
>
  <svg viewBox="0 0 140 140" fill="none" aria-hidden="true">
    <defs>
      <radialGradient id="rupi-face" cx="36%" cy="30%" r="80%">
        <stop offset="0" stop-color="#ffe08a" />
        <stop offset="100%" stop-color="#f0b429" />
      </radialGradient>
      <filter id="rupi-shadow" x="-50%" y="-50%" width="200%" height="200%">
        <feDropShadow dx="0" dy="4" stdDeviation="5" flood-color="#c98a12" flood-opacity="0.3" />
      </filter>
    </defs>

    <!-- ground shadow -->
    <ellipse class="ground" cx="70" cy="126" rx="26" ry="4.5" fill="#000" opacity="0.1" />

    <!-- hands: two simple rounded mitts, just clear of the coin -->
    <circle class="hand hand-l" cx="22" cy="80" r="10" fill="#eaa81f" />
    <circle class="hand hand-r" cx="118" cy="80" r="10" fill="#eaa81f" />

    <!-- coin -->
    <circle class="coin" cx="70" cy="62" r="46" fill="url(#rupi-face)" filter="url(#rupi-shadow)" />

    <!-- face: eyes + smile only -->
    <g class="face" fill="#3a2a08">
      <circle class="eye eye-l" cx="56" cy="58" r="5" />
      <circle class="eye eye-r" cx="84" cy="58" r="5" />
      <path class="mouth" d="M56 74 Q70 86 84 74" stroke="#3a2a08" stroke-width="4" stroke-linecap="round" fill="none" />
      <!-- blink lids -->
      <g class="lids" fill="url(#rupi-face)">
        <rect class="lid lid-l" x="50" y="52" width="12" height="7" rx="3.5" />
        <rect class="lid lid-r" x="78" y="52" width="12" height="7" rx="3.5" />
      </g>
    </g>
  </svg>
</div>
