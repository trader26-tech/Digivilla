<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
</head>
<body>
<x-dc>
<helmet>
  <style>
    body { margin:0; background:transparent; color:#e9e9ed; font:14px/1.5 Inter, system-ui, sans-serif; }
  </style>
</helmet>
<!-- Stage 5 of the ladder — the finished villa. The <svg> body is the APP's own villa
     (client/frontend/public/assets/levels/villa.svg, the estate-map tile), inlined by
     build.py at the APP-VILLA marker so the website and the app can never drift. -->
<div style="max-width:920px;margin:0 auto;padding:{{ wrapPad }}" data-tile-wrap="1">
  <sc-if value="{{ doc }}" hint-placeholder-val="{{ true }}">
  <h1 style="font-weight:500;font-size:26px;letter-spacing:-.01em;margin:0 0 6px">Isometric plot — the villa</h1>
  <p style="color:#9a9aa5;margin:0 0 28px">Stage 5 of the ladder — the app's own villa tile, verbatim.</p>
  </sc-if>
  <svg viewBox="0 -60 820 700" style="width:100%;height:auto;display:block"><!--APP-VILLA--></svg>
</div>
</x-dc>
<script type="text/x-dc" data-dc-script>
class Component extends DCLogic {
  renderVals() { return { doc: !this.props.tile, wrapPad: this.props.tile ? '0' : '48px 24px 80px' }; }
}
</script>
</body>
</html>
