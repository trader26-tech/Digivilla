<main class="deed">
  <!-- ===== brand plate ===== -->
  <header class="masthead reveal" style="--s:0">
    <span class="plate"><span class="plate-mark" aria-hidden="true">◈</span>PropertyNest</span>
  </header>

  <!-- ===== search + filter ===== -->
  <div class="toolbar reveal" style="--s:1">
    <div class="search">
      <svg class="search-ic" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true">
        <circle cx="11" cy="11" r="7" fill="none" stroke="currentColor" stroke-width="1.8"/>
        <path d="M16 16l4 4" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round"/>
      </svg>
      <input
        class="search-in"
        type="search"
        inputmode="search"
        placeholder="Search estates"
        autocomplete="off"
        [ngModel]="query"
        (ngModelChange)="onQuery($event)"
        aria-label="Search estates"
      />
    </div>
    <button class="filter-btn" type="button"
      [class.on]="filter !== 'all'"
      [attr.aria-expanded]="filterOpen"
      (click)="filterOpen = !filterOpen">
      <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M4 6h16M7 12h10M10 18h4" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linecap="round"/></svg>
    </button>
  </div>

  <!-- filter menu -->
  <div class="filter-menu" *ngIf="filterOpen">
    <button
      *ngFor="let o of filterOptions"
      class="fm-item"
      type="button"
      [class.on]="filter === o.key"
      (click)="pickFilter(o.key)"
    >
      {{ o.label }}
      <svg *ngIf="filter === o.key" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M5 12l5 5 9-11" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ===== property chips (All selected by default) ===== -->
  <div class="chips reveal" style="--s:2" role="tablist" aria-label="Property type">
    <button
      *ngFor="let c of chips"
      class="chip"
      type="button"
      role="tab"
      [class.on]="activeKey === c.key"
      [attr.aria-selected]="activeKey === c.key"
      (click)="selectChip(c.key)"
    >
      <span class="chip-ic" [ngSwitch]="c.key" aria-hidden="true">
        <svg *ngSwitchCase="'all'" viewBox="0 0 24 24" width="16" height="16"><rect x="4" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="4" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="4" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><rect x="13" y="13" width="7" height="7" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/></svg>
        <svg *ngSwitchCase="'land'" viewBox="0 0 24 24" width="16" height="16"><path d="M3 17l7-8 5 4 6-7" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/><path d="M3 20h18" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
        <svg *ngSwitchCase="'flat'" viewBox="0 0 24 24" width="16" height="16"><rect x="4" y="5" width="16" height="14" rx="1.5" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M4 12h16M12 5v14" stroke="currentColor" stroke-width="1.7"/></svg>
        <svg *ngSwitchCase="'apartment'" viewBox="0 0 24 24" width="16" height="16"><rect x="7" y="4" width="10" height="16" rx="1" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M10 8h1M13 8h1M10 12h1M13 12h1M11 20v-3h2v3" stroke="currentColor" stroke-width="1.5" stroke-linecap="round"/></svg>
        <svg *ngSwitchCase="'duplex'" viewBox="0 0 24 24" width="16" height="16"><path d="M4 20V10l8-5 8 5v10M4 14h16" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </span>
      {{ c.name }}
    </button>
  </div>

  <!-- ===== tiles ===== -->
  <div class="tiles">
    <button
      *ngFor="let t of tiles; let i = index"
      class="tile reveal"
      type="button"
      [style.--s]="i + 3"
      (click)="open(t.p, t.v.key)"
      [attr.aria-label]="t.v.label + ' ' + t.p.name"
    >
      <!-- top row: icon + name + price -->
      <div class="tile-top">
        <span class="tile-ic" [attr.data-v]="t.v.key" aria-hidden="true" [ngSwitch]="t.v.key">
          <svg *ngSwitchCase="'ready'" viewBox="0 0 24 24" width="20" height="20"><circle cx="8" cy="9" r="4" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M11 11l7 7M15 15l2-2M17 17l2-2" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
          <svg *ngSwitchCase="'construction'" viewBox="0 0 24 24" width="20" height="20"><path d="M5 20h14M7 20V9l5-3 5 3v11M10 20v-4h4v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
          <svg *ngSwitchCase="'prelaunch'" viewBox="0 0 24 24" width="20" height="20"><path d="M4 18L10 12l4 4 6-8M20 8h-4M20 8v4" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linecap="round" stroke-linejoin="round"/></svg>
        </span>
        <span class="tile-head">
          <span class="tile-name">{{ t.v.label }} {{ t.p.name }}</span>
          <span class="tile-price">{{ compact(t.p.price) }} · {{ t.p.incomePays ? 'income + growth' : 'pure growth' }}</span>
        </span>
        <svg class="tile-chev" viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </div>

      <!-- stat row: the numbers -->
      <div class="tile-stats">
        <div class="stat">
          <span class="stat-v">{{ t.v.growthPct }}%<span class="u">/yr</span></span>
          <span class="stat-l">Expected growth</span>
        </div>
        <div class="stat">
          <span class="stat-v pos">{{ t.v.past3y }}%<span class="u">/yr</span></span>
          <span class="stat-l">Past 3 years</span>
        </div>
        <div class="stat">
          <span class="stat-v" [class.income]="t.p.incomePays">{{ t.p.incomePays ? inr(t.v.monthlyIncome!) : '—' }}</span>
          <span class="stat-l">{{ t.p.incomePays ? 'Monthly income' : 'No income' }}</span>
        </div>
      </div>
    </button>

    <p class="no-match" *ngIf="!tiles.length">No estates match your filters.</p>
  </div>

  <!-- ===== footnote ===== -->
  <p class="disclaimer">
    <span class="star">*</span> Illustrative — not guaranteed. Past returns don't
    assure future ones. Rent begins after month 12. Subject to market risk.
  </p>
</main>
