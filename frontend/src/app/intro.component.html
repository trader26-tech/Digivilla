<div class="intro" [class.leave]="leaving" aria-hidden="true">
  <!-- cinematic sunrise scene -->
  <div class="scene">
    <span class="sun"></span>
    <span class="glow"></span>
    <div class="hills">
      <span class="hill h1"></span>
      <span class="hill h2"></span>
      <span class="hill h3"></span>
    </div>
    <span class="grain"></span>
  </div>

  <!-- wordmark -->
  <div class="mark">
    <span class="kicker">Welcome to your</span>
    <h1 class="freedom">
      <span class="w">financial</span>
      <span class="w em">freedom</span>
    </h1>
    <span class="rule"></span>
  </div>
</div>
