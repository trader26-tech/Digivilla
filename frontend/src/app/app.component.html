<!-- Cinematic welcome, every launch, before everything -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- Pre-login flow. Wrapped so the steps slide between each other as one
     continuous journey (forward = slide left, back = slide right). -->
<div class="pre-login" *ngIf="!intro && !authed" [@stepAnim]="preStep">
  <!-- Step 1: no-login goal picker -->
  <app-goal-picker
    *ngIf="!pickedGoal && !chosenGoal"
    (goalChosen)="onGoalChosen($event)"
  ></app-goal-picker>

  <!-- Step 2: ONE combined screen — animated "why" + the amount calculator. -->
  <app-goal-intro
    *ngIf="!pickedGoal && chosenGoal && !amountDone"
    [goal]="chosenGoal"
    (amountReady)="onAmountChosen($event)"
    (back)="onAmountBack()"
  ></app-goal-intro>

  <!-- Step 3: choose how long to invest (horizon -> live target date) -->
  <app-goal-timing
    *ngIf="!pickedGoal && amountDone && !timingDone && chosenGoal"
    [goal]="chosenGoal"
    [amount]="chosenAmount"
    (timingChosen)="onTimingChosen($event)"
    (back)="onTimingBack()"
  ></app-goal-timing>

  <!-- Step 5: results — monthly SIP + expected mutual-fund returns (placeholder) -->
  <app-goal-result
    *ngIf="!pickedGoal && timingDone && chosenGoal"
    [goal]="chosenGoal"
    [amount]="chosenAmount"
    [years]="chosenYears"
    (continued)="onResultContinue($event)"
    (back)="onResultBack()"
  ></app-goal-result>

  <!-- Step 6: goal added -> dummy home + quick-login bottom sheet -->
  <app-goal-home
    *ngIf="pickedGoal && chosenGoal"
    [goal]="chosenGoal"
    [amount]="chosenAmount"
    [monthly]="chosenMonthly"
    [years]="chosenYears"
    (loggedIn)="onQuickLogin($event)"
  ></app-goal-home>
</div>

<ng-container *ngIf="pickedGoal && authed">
<div class="shell" [class.dock-open]="plannerOpen">
  <div class="main-col">
    <header class="topnav">
      <div class="brand"><span class="logo">◆</span><span>WealthPath</span></div>
      <nav class="tabs">
        <button [class.active]="tab === 'home'" (click)="setTab('home')">Home</button>
        <button [class.active]="tab === 'invest'" (click)="setTab('invest')">Build &amp; Research</button>
      </nav>
      <div class="nav-user">
        <span class="hello" *ngIf="userName">Hi, {{ userName }}</span>
        <button class="signout" (click)="signOut()" title="Sign out">Sign out</button>
      </div>
    </header>

    <app-home
      *ngIf="tab === 'home'"
      [refreshKey]="goalsVersion"
      (planNew)="togglePlanner()"
      (exploreFunds)="setTab('invest')"
    ></app-home>

    <app-basket-lab *ngIf="tab === 'invest'" (saved)="onBasketSaved()"></app-basket-lab>
  </div>

  <aside class="dock" [class.open]="plannerOpen">
    <app-planner-panel
      *ngIf="plannerOpen"
      (closePanel)="closePlanner()"
      (goalSaved)="onGoalSaved()"
    ></app-planner-panel>
  </aside>
</div>

<div class="dock-backdrop" *ngIf="plannerOpen" (click)="closePlanner()"></div>

<div class="fabs" *ngIf="!plannerOpen">
  <button class="fab primary" (click)="togglePlanner()">
    <span class="fab-icon">◎</span><span class="fab-text">Plan a goal</span>
  </button>
</div>
</ng-container>

<!-- Always-on "refresh to latest" button — force-clears the PWA cache so the
     newest deploy always loads. Floats above every screen. -->
<app-refresh-button></app-refresh-button>
