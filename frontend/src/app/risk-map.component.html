<main class="rm">
  <!-- gesture viewport (fixed on screen) -->
  <div class="rm-viewport"
       (pointerdown)="onPointerDown($event)"
       (pointermove)="onPointerMove($event)"
       (pointerup)="onPointerUp()"
       (pointercancel)="onPointerUp()"
       (pointerleave)="onPointerUp()"
       (wheel)="onWheel($event)"
       (touchstart)="onTouchStart($event)"
       (touchmove)="onTouchMove($event)"
       (touchend)="onTouchEnd($event)">

    <!-- the board: pans + zooms via CSS transform -->
    <div class="rm-board" [style.transform]="mapTransform()">
      <!-- terrain + grid + axes as an SVG backdrop -->
      <svg class="rm-bg" viewBox="0 0 1000 720" preserveAspectRatio="none" aria-hidden="true">
        <defs>
          <linearGradient id="terrain" x1="0" y1="1" x2="1" y2="0">
            <stop offset="0%" stop-color="#DDECE0"/>
            <stop offset="48%" stop-color="#FAF8F3"/>
            <stop offset="100%" stop-color="#F2E1D8"/>
          </linearGradient>
        </defs>
        <rect x="0" y="0" width="1000" height="720" fill="url(#terrain)"/>
        <g class="rm-grid">
          <line *ngFor="let gx of gridX" [attr.x1]="gx" y1="0" [attr.x2]="gx" y2="720"/>
          <line *ngFor="let gy of gridY" x1="0" [attr.y1]="gy" x2="1000" [attr.y2]="gy"/>
        </g>
        <!-- fair-value 'main road' -->
        <line class="rm-diag" [attr.x1]="diag.x1" [attr.y1]="diag.y1" [attr.x2]="diag.x2" [attr.y2]="diag.y2"/>
        <!-- axes -->
        <line class="rm-axis" [attr.x1]="padL" [attr.y1]="720 - padB" x2="972" [attr.y2]="720 - padB"/>
        <line class="rm-axis" [attr.x1]="padL" [attr.y1]="720 - padB" [attr.x2]="padL" [attr.y2]="padT - 6"/>
      </svg>

      <!-- axis word cues (HTML so they stay crisp) -->
      <span class="rm-axr">RISK →</span>
      <span class="rm-axre">REWARD →</span>
      <span class="rm-corner low">calm · steady</span>
      <span class="rm-corner high">racy · high growth</span>

      <!-- property markers: real HTML buttons = reliable taps -->
      <button *ngFor="let pin of pins(); let i = index"
              class="rm-marker"
              type="button"
              [class.sel]="pin.isSelected"
              [style.left.%]="pin.xPct"
              [style.top.%]="pin.yPct"
              [style.--c]="pin.color"
              [style.--d]="i * 0.04 + 's'"
              (click)="select(pin)"
              [attr.aria-label]="pin.name + ' ' + pin.propName + ', ' + pin.riskLabel + ', reward ' + pin.reward + '%'">
        <span class="mk-glow"></span>
        <svg class="mk-pin" viewBox="0 0 28 40" aria-hidden="true">
          <path d="M14 39 C4 26 1 20 1 13 A13 13 0 0 1 27 13 C27 20 24 26 14 39 Z"/>
          <circle cx="14" cy="13" r="5.2"/>
        </svg>
        <span class="mk-label">{{ pin.shortName }}</span>
      </button>
    </div>

    <!-- floating controls (screen-fixed) -->
    <button class="rm-back" type="button" (click)="goBack()" aria-label="Back to properties">
      <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="rm-zoom">
      <button type="button" (click)="zoomIn()" aria-label="Zoom in">＋</button>
      <button type="button" (click)="zoomOut()" aria-label="Zoom out">－</button>
      <button type="button" class="rm-reset" (click)="resetView()" aria-label="Reset view">⤢</button>
    </div>
    <div class="rm-legend">
      <span class="lg" *ngFor="let p of legendProps" [style.--c]="colorOf(p)"><i class="lg-dot"></i>{{ propName(p) }}</span>
    </div>
    <div class="rm-hint" *ngIf="!card()">Drag to explore · pinch to zoom · tap a pin</div>
  </div>

  <!-- minimal slide-up info card -->
  <div class="rm-sheet" [class.open]="card()" *ngIf="card() as c" [style.--c]="c.color">
    <button class="sheet-x" type="button" (click)="closeCard()" aria-label="Close">×</button>
    <div class="sheet-row">
      <span class="sheet-name">{{ c.name }}</span>
      <span class="sheet-tag">{{ c.propName }} · {{ c.riskLabel }}</span>
    </div>
    <div class="sheet-figs">
      <span class="sf"><b class="pos">{{ pct(c.reward) }}</b> return</span>
      <span class="sf" *ngIf="c.incomePays"><b>{{ inr(c.rentMonthly) }}</b>/mo</span>
      <span class="sf" *ngIf="!c.incomePays"><b>Growth</b> only</span>
      <span class="sf"><b>{{ compact(c.price) }}</b> ticket</span>
    </div>
    <button class="sheet-cta" type="button" (click)="viewFull()">View details →</button>
  </div>
</main>
