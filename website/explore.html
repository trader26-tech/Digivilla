/* ── EXPLORE (phones) · the "Return & risk" lesson, 9 steps, then the calculator full-screen ────
   Ported from the explore-flow handoff (Story Mobile.html). Same look and timing; built to stay
   smooth on any phone: the hand-drawn look is BAKED into the path data once at mount (no SVG
   displacement filter re-rendering while the pen draws), glows are radial gradients (no Gaussian
   blur, no drop-shadows), nothing uses backdrop-filter, every move is opacity/transform or a
   stroke-dashoffset draw. One tap or one swipe = one step; the card and the graph both advance.
   NARRATED: one recorded voice (assets/voice/lesson.mp3, one segment per step) — the pen leads, the voice follows 220 ms
   later, and when a line ends the lesson moves on by itself; any touch takes over. Played through Web Audio (sample-exact
   segments, click-free fades, and it still speaks with the iPhone's silent switch on); the Voice pill turns it off.
   Step 9's CTA (or Skip) opens the INVITE: our private WhatsApp group, one tap to join — or straight on to THE calculator
   (the landing's #calculator — there is only one). Someone who has tapped Join goes straight to the calculator next time. */
html,body{margin:0;height:100%;overflow:hidden;overscroll-behavior:none;background:#0b0c12}
