<div class="screen" [class.entered]="entered" [style.--hue]="hue">
  <button class="back" (click)="goBack()" aria-label="Back">←</button>

  <div class="top">
    <span class="eyebrow">{{ goal.label }}</span>
    <h1>When do you want to reach it?</h1>
    <p class="sub">Slide to set how long you'll invest — we'll show the date you'll get there.</p>
  </div>

  <!-- Live target date -->
  <div class="date-hero">
    <span class="by">By</span>
    <div class="date">
      <span class="month">{{ targetMonthName }}</span>
      <span class="year">{{ targetYear }}</span>
    </div>
    <span class="dur">that's <b>{{ durationLabel }}</b> from today</span>
  </div>

  <!-- Slider -->
  <div class="slider-wrap">
    <input
      type="range"
      class="slider"
      [min]="minMonths"
      [max]="maxMonths"
      step="1"
      [value]="months"
      (input)="onSlide($any($event.target).value)"
      [style.--frac]="frac"
    />
    <div class="ends">
      <span>6 months</span>
      <span>40 years</span>
    </div>
  </div>

  <!-- Quick presets -->
  <div class="chips">
    <button *ngFor="let p of presets" class="chip" [class.on]="isActive(p.months)" (click)="pick(p.months)">
      {{ p.label }}
    </button>
  </div>

  <button class="cta" (click)="confirm()">Continue</button>
</div>
