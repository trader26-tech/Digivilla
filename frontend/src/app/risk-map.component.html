<main class="rm">
  <!-- back arrow only, no text -->
  <button class="rm-back" type="button" (click)="goBack()" aria-label="Back to properties">
    <svg viewBox="0 0 24 24" width="24" height="24" aria-hidden="true">
      <path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/>
    </svg>
  </button>

  <!-- the map — pure visual, no words -->
  <div class="rm-wrap">
    <svg class="rm-svg" [attr.viewBox]="'0 0 ' + W + ' ' + H" role="img" aria-label="Risk versus reward map of every estate">
      <defs>
        <linearGradient id="rmGlow" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0%" stop-color="var(--positive)" stop-opacity="0.04"/>
          <stop offset="100%" stop-color="var(--positive)" stop-opacity="0.16"/>
        </linearGradient>
        <marker id="rmArrow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
          <path d="M0 0 L10 5 L0 10 z" fill="var(--ink)" opacity="0.45"/>
        </marker>
      </defs>

      <!-- plot background -->
      <rect [attr.x]="padL" [attr.y]="padT" [attr.width]="W - padL - padR" [attr.height]="H - padT - padB" rx="16" fill="url(#rmGlow)"/>

      <!-- axes, with arrowheads = the only directional cue (reward↑, risk→) -->
      <line class="rm-axis" [attr.x1]="padL" [attr.y1]="H - padB" [attr.x2]="W - padR + 6" [attr.y2]="H - padB" marker-end="url(#rmArrow)"/>
      <line class="rm-axis" [attr.x1]="padL" [attr.y1]="H - padB" [attr.x2]="padL" [attr.y2]="padT - 6" marker-end="url(#rmArrow)"/>

      <!-- fair-value diagonal -->
      <line class="rm-diag" [attr.x1]="diag.x1" [attr.y1]="diag.y1" [attr.x2]="diag.x2" [attr.y2]="diag.y2"/>

      <!-- pins: coloured dots only, the selected one highlighted -->
      <g *ngFor="let pin of pins(); let i = index; trackBy: trackPin"
         class="rm-pin"
         [class.sel]="pin.isSelected"
         [style.--d]="i * 0.045 + 's'"
         [style.--c]="pin.color"
         (click)="select(pin)"
         tabindex="0"
         role="button"
         [attr.aria-label]="pin.name + ' ' + pin.propName + ', ' + pin.riskLabel + ', reward ' + pin.reward + '%'">
        <circle class="rm-halo" [attr.cx]="pin.cx" [attr.cy]="pin.cy" r="22"/>
        <circle class="rm-dot" [attr.cx]="pin.cx" [attr.cy]="pin.cy" r="11"/>
      </g>
    </svg>
  </div>
</main>
