<main class="login">
  <!-- brand -->
  <div class="lg-brand">
    <div class="lg-mark" aria-hidden="true">
      <svg viewBox="0 0 48 48" width="46" height="46">
        <path d="M8 24L24 10l16 14M12 22v14h24V22" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round" stroke-linecap="round"/>
        <path d="M20 36v-8h8v8" fill="none" stroke="currentColor" stroke-width="2.6" stroke-linejoin="round"/>
      </svg>
    </div>
    <span class="lg-kicker">MY LAKSHYAS</span>
    <h1 class="lg-title">Your estate,<br>in your name.</h1>
  </div>

  <!-- STEP 1 · phone -->
  <form class="lg-card" *ngIf="step() === 'phone'" (ngSubmit)="sendCode()" novalidate>
    <label class="lg-field">
      <span class="lg-lbl">Your name</span>
      <input class="lg-input" type="text" autocomplete="name" placeholder="Sanjeev"
             [ngModel]="name()" (ngModelChange)="name.set($event)" name="name" />
    </label>

    <label class="lg-field">
      <span class="lg-lbl">Phone number</span>
      <div class="lg-phone">
        <span class="lg-cc">+91</span>
        <input class="lg-input" type="tel" inputmode="numeric" autocomplete="tel" maxlength="10"
               placeholder="98765 43210"
               [ngModel]="phone()" (ngModelChange)="phone.set($event)" name="phone" />
      </div>
    </label>

    <p class="lg-err" *ngIf="error()">{{ error() }}</p>

    <button class="lg-btn" type="submit" [disabled]="!phoneValid || busy()">
      <span *ngIf="!busy()">Send code</span>
      <span *ngIf="busy()" class="lg-spin" aria-hidden="true"></span>
    </button>

    <p class="lg-fine">
      We’ll text you a 6-digit code to verify it’s you.
      <span *ngIf="!firebaseReady" class="lg-dev">Dev mode — use code 123456.</span>
    </p>
  </form>

  <!-- STEP 2 · OTP -->
  <form class="lg-card" *ngIf="step() === 'otp'" (ngSubmit)="verify()" novalidate>
    <button class="lg-edit" type="button" (click)="editPhone()">‹ +91 {{ phone() }}</button>
    <span class="lg-lbl big">Enter the code</span>
    <span class="lg-sub">Sent to your phone by SMS</span>

    <input class="lg-otp" type="tel" inputmode="numeric" autocomplete="one-time-code" maxlength="6"
           placeholder="••••••" [ngModel]="code()" (ngModelChange)="code.set($event)" name="code" />

    <p class="lg-err" *ngIf="error()">{{ error() }}</p>

    <button class="lg-btn" type="submit" [disabled]="!codeValid || busy()">
      <span *ngIf="!busy()">Verify &amp; enter</span>
      <span *ngIf="busy()" class="lg-spin" aria-hidden="true"></span>
    </button>

    <button class="lg-resend" type="button" (click)="resend()">Didn’t get it? Resend</button>
  </form>

  <!-- invisible reCAPTCHA mount for Firebase phone auth -->
  <div id="recaptcha-container"></div>
</main>
