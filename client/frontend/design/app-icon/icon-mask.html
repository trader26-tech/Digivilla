<!doctype html><html><head><meta charset="utf-8"><style>
html,body{margin:0;background:transparent}
.ic{position:relative;width:1024px;height:1024px;overflow:hidden;
  background:
    radial-gradient(520px 260px at 50% 74%, rgba(108,186,54,.55), transparent 70%),
    radial-gradient(360px 300px at 50% 30%, rgba(246,196,69,.40), transparent 70%),
    radial-gradient(900px 700px at 50% 12%, #3b3a8f 0%, #23245c 38%, #121433 70%, #0a0b1c 100%);}
.var2 .ic{background:
    radial-gradient(520px 260px at 50% 74%, rgba(108,186,54,.50), transparent 70%),
    radial-gradient(330px 280px at 50% 30%, rgba(246,196,69,.45), transparent 70%),
    linear-gradient(180deg, #1f6f5c 0%, #164a4a 38%, #0f2a33 72%, #08141b 100%);}
.rays{position:absolute;inset:0;background:repeating-conic-gradient(from 0deg at 50% 30%, rgba(255,255,255,.05) 0 6deg, transparent 6deg 18deg);
  -webkit-mask: radial-gradient(420px 420px at 50% 30%, #000 0%, transparent 75%); mask: radial-gradient(420px 420px at 50% 30%, #000 0%, transparent 75%);}
.stars i{position:absolute;width:6px;height:6px;border-radius:50%;background:#fff;opacity:.7;box-shadow:0 0 10px 2px rgba(255,255,255,.5)}
.ground{position:absolute;left:50%;top:720px;width:780px;height:120px;margin-left:-390px;border-radius:50%;background:radial-gradient(closest-side,rgba(0,0,0,.55),transparent)}
.villa{position:absolute;left:50%;top:318px;width:740px;margin-left:-370px;filter:drop-shadow(0 30px 34px rgba(0,0,0,.55))}
.coin{position:absolute;left:50%;top:112px;width:236px;margin-left:-118px;filter:drop-shadow(0 0 40px rgba(246,196,69,.75)) drop-shadow(0 18px 18px rgba(0,0,0,.35))}
.art{position:absolute;inset:0}.mask .art{transform:scale(.84);transform-origin:50% 52%}
</style></head><body class="mask"><div class="ic">
<div class="rays"></div>
<div class="stars"><i style="left:150px;top:150px"></i><i style="left:860px;top:200px;width:4px;height:4px"></i><i style="left:220px;top:420px;width:4px;height:4px;opacity:.5"></i><i style="left:800px;top:470px;width:5px;height:5px;opacity:.55"></i><i style="left:330px;top:90px;width:3px;height:3px"></i><i style="left:700px;top:110px;width:4px;height:4px"></i></div>
<div class="art"><div class="ground"></div>
<img class="villa" src="../../public/assets/calc/villa.svg"><img class="coin" src="../../public/assets/calc/coin.svg"></div>
</div></body></html>
