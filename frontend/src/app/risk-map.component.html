<main class="rm">
  <header class="rm-top">
    <button class="rm-back" type="button" (click)="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24" width="22" height="22" aria-hidden="true"><path d="M15 6l-6 6 6 6" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <span class="rm-title">Risk <span class="x">×</span> Reward</span>
    <button class="rm-list-btn" type="button" (click)="toggleList()" [class.on]="listOpen()">
      {{ listOpen() ? 'Map' : 'List' }}
    </button>
  </header>

  <p class="rm-lede">Every estate placed by its real risk and return. Tap a point.</p>

  <!-- ===== the map ===== -->
  <div class="rm-wrap" *ngIf="!listOpen()">
    <svg class="rm-svg" [attr.viewBox]="'0 0 ' + W + ' ' + H" role="img" aria-label="Risk versus reward map">
      <defs>
        <linearGradient id="rmG" x1="0" y1="1" x2="1" y2="0">
          <stop offset="0" stop-color="color-mix(in srgb, var(--positive) 12%, var(--paper))"/>
          <stop offset="50" stop-color="var(--paper)"/>
          <stop offset="100" stop-color="color-mix(in srgb, var(--terracotta) 10%, var(--paper))"/>
        </linearGradient>
      </defs>
      <rect [attr.x]="padL" [attr.y]="padT" [attr.width]="W - padL - padR" [attr.height]="H - padT - padB" rx="14" fill="url(#rmG)"/>

      <!-- axes -->
      <line class="rm-axis" [attr.x1]="padL" [attr.y1]="H - padB" [attr.x2]="W - padR" [attr.y2]="H - padB"/>
      <line class="rm-axis" [attr.x1]="padL" [attr.y1]="padT" [attr.x2]="padL" [attr.y2]="H - padB"/>
      <line class="rm-diag" [attr.x1]="diag.x1" [attr.y1]="diag.y1" [attr.x2]="diag.x2" [attr.y2]="diag.y2"/>
      <text class="rm-ax" [attr.x]="padL + (W - padL - padR) / 2" [attr.y]="H - 26" text-anchor="middle">RISK →</text>
      <text class="rm-ax" [attr.x]="22" [attr.y]="padT + (H - padT - padB) / 2" text-anchor="middle" [attr.transform]="'rotate(-90 22 ' + (padT + (H - padT - padB) / 2) + ')'">REWARD →</text>

      <!-- pins -->
      <g *ngFor="let pin of pins(); let i = index; trackBy: trackPin"
         class="rm-pin"
         [class.sel]="pin.property === selectedPin()?.property && pin.variant === selectedPin()?.variant"
         [style.--c]="pin.color" [style.--d]="i * 0.03 + 's'"
         (click)="select(pin)" tabindex="0" role="button"
         [attr.aria-label]="pin.name + ', ' + pin.propName + ', reward ' + pin.reward + '%, ' + pin.riskWord">
        <circle class="rm-halo" [attr.cx]="pin.cx" [attr.cy]="pin.cy" r="18"/>
        <circle class="rm-dot" [attr.cx]="pin.cx" [attr.cy]="pin.cy" r="8"/>
        <text class="rm-plab" [attr.x]="pin.cx" [attr.y]="pin.cy - 14" text-anchor="middle">{{ pin.name.split(' ')[0] }}</text>
      </g>
    </svg>

    <div class="rm-legend">
      <span class="lg" *ngFor="let p of legendProps" [style.--c]="colorOf(p)"><i class="lg-dot"></i>{{ propName(p) }}</span>
    </div>

    <!-- selected readout -->
    <div class="rm-read" *ngIf="selectedPin() as pin" [style.--c]="pin.color">
      <div class="rr-h"><span class="rr-name">{{ pin.name }}</span><span class="rr-p">{{ pin.propName }} · {{ pin.riskWord }}</span></div>
      <div class="rr-figs">
        <span class="rr-f"><b class="pos">{{ pct(pin.reward) }}</b> return</span>
        <span class="rr-f"><b>{{ pct(pin.risk) }}</b> risk</span>
      </div>
      <button class="rr-cta" type="button" (click)="viewDetail(pin)">See {{ pin.name }} →</button>
    </div>
  </div>

  <!-- ===== the value list ===== -->
  <div class="rm-listview" *ngIf="listOpen()">
    <button class="li" *ngFor="let pin of listPins(); trackBy: trackPin"
            type="button" (click)="viewDetail(pin)" [style.--c]="pin.color">
      <span class="li-dot"></span>
      <span class="li-main">
        <span class="li-name">{{ pin.name }}</span>
        <span class="li-sub">{{ pin.propName }} · {{ pin.riskWord }}</span>
      </span>
      <span class="li-figs">
        <span class="li-ret">{{ pct(pin.reward) }}<small>return</small></span>
        <span class="li-risk">{{ pct(pin.risk) }}<small>risk</small></span>
      </span>
      <svg class="li-chev" viewBox="0 0 24 24" width="16" height="16" aria-hidden="true"><path d="M9 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <p class="rm-note">Risk = real 5-yr volatility · Return = real Regular-plan return. Illustrative, not a promise.</p>
</main>
