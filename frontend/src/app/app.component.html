<!-- Opening animation, plays once on launch. -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- The storefront: the four property tiers. -->
<app-storefront
  *ngIf="!intro && detail === null"
  (openProperty)="openProperty($event)"
></app-storefront>

<!-- Land keeps its own dedicated detail page. -->
<app-land-detail
  *ngIf="!intro && detail?.property === 'land'"
  [initialVariant]="detail!.variant"
  (back)="closeDetail()"
></app-land-detail>

<!-- Flat / Apartment / Duplex use the generic property-detail page. -->
<app-property-detail
  *ngIf="!intro && detail && detail.property !== 'land'"
  [property]="detail.property"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-property-detail>
