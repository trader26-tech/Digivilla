# Local development orchestration.
#
# On Railway, deploy `backend/` and `frontend/` as two separate services (each
# has its own Dockerfile + railway.toml). This compose file is for running the
# whole stack locally against a Supabase project.
services:
  backend:
    build:
      context: ./backend
    env_file:
      - ./backend/.env
    environment:
      # Allow the browser app (served at :4200) to call the API.
      BACKEND_CORS_ORIGINS: "http://localhost:4200,http://localhost:8080"
      PORT: "8000"
    ports:
      - "8000:8000"

  frontend:
    build:
      context: ./frontend
    environment:
      PORT: "8080"
      API_URL: "http://localhost:8000/api/v1"
      # Set these to your Supabase project values for a full local run:
      SUPABASE_URL: "${SUPABASE_URL:-}"
      SUPABASE_ANON_KEY: "${SUPABASE_ANON_KEY:-}"
    ports:
      - "8080:8080"
    depends_on:
      - backend
