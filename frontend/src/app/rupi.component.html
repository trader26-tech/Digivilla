<div
  class="rupi"
  [class.animated]="animated"
  [attr.data-pose]="pose"
  [style.width.px]="size"
  [style.height.px]="size"
>
  <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
    <defs>
      <radialGradient id="rupi-face" cx="38%" cy="32%" r="75%">
        <stop offset="0" stop-color="#ffe9a8" />
        <stop offset="55%" stop-color="#f6c452" />
        <stop offset="100%" stop-color="#e39a1f" />
      </radialGradient>
      <linearGradient id="rupi-rim" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd873" />
        <stop offset="1" stop-color="#d98f16" />
      </linearGradient>
      <filter id="rupi-shadow" x="-40%" y="-40%" width="180%" height="180%">
        <feDropShadow dx="0" dy="6" stdDeviation="6" flood-color="#c07f10" flood-opacity="0.35" />
      </filter>
    </defs>

    <!-- soft ground shadow -->
    <ellipse class="ground" cx="60" cy="112" rx="26" ry="5" fill="#000" opacity="0.12" />

    <!-- ARMS (behind the coin body); pose-specific via CSS classes -->
    <g class="arm arm-l" stroke="#e39a1f" stroke-width="6" stroke-linecap="round">
      <path d="M28 66 Q14 62 12 50" />
      <circle cx="12" cy="49" r="5.5" fill="#f6c452" stroke="none" />
    </g>
    <g class="arm arm-r" stroke="#e39a1f" stroke-width="6" stroke-linecap="round">
      <path d="M92 66 Q106 66 110 78" />
      <circle cx="110" cy="79" r="5.5" fill="#f6c452" stroke="none" />
    </g>

    <!-- COIN body -->
    <g filter="url(#rupi-shadow)">
      <circle cx="60" cy="60" r="40" fill="url(#rupi-rim)" />
      <circle cx="60" cy="60" r="33" fill="url(#rupi-face)" />
      <!-- coin notches around the rim -->
      <g stroke="#d98f16" stroke-width="2" opacity="0.5">
        <path d="M60 20v5M60 95v5M20 60h5M95 60h5M31 31l3.5 3.5M85.5 85.5l3.5 3.5M89 31l-3.5 3.5M34.5 85.5l-3.5 3.5" />
      </g>
    </g>

    <!-- faint ₹ watermark on the cheek -->
    <text x="82" y="50" text-anchor="middle" font-size="12" font-weight="800" fill="#d98f16" opacity="0.28">₹</text>

    <!-- FACE -->
    <g class="face">
      <!-- eyes -->
      <g class="eyes" fill="#3a2a08">
        <circle class="eye eye-l" cx="49" cy="56" r="4.2" />
        <circle class="eye eye-r" cx="71" cy="56" r="4.2" />
        <!-- eye sparkles -->
        <circle cx="50.4" cy="54.6" r="1.3" fill="#fff" />
        <circle cx="72.4" cy="54.6" r="1.3" fill="#fff" />
      </g>
      <!-- blink lids (scaleY animated) -->
      <g class="lids" fill="url(#rupi-face)">
        <rect class="lid lid-l" x="43" y="50" width="12" height="7" rx="3.5" />
        <rect class="lid lid-r" x="65" y="50" width="12" height="7" rx="3.5" />
      </g>
      <!-- cheeks -->
      <circle cx="44" cy="66" r="4" fill="#ff9a6a" opacity="0.35" />
      <circle cx="76" cy="66" r="4" fill="#ff9a6a" opacity="0.35" />
      <!-- smile -->
      <path class="mouth" d="M50 68 Q60 78 70 68" stroke="#3a2a08" stroke-width="3.2" stroke-linecap="round" fill="none" />
    </g>
  </svg>
</div>
