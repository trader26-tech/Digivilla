<div
  class="rupi"
  [class.animated]="animated"
  [attr.data-pose]="pose"
  [style.width.px]="size"
  [style.height.px]="size"
>
  <svg viewBox="0 0 120 120" fill="none" aria-hidden="true">
    <defs>
      <linearGradient id="rupi-body" x1="0" y1="0" x2="0" y2="1">
        <stop offset="0" stop-color="#ffd35e" />
        <stop offset="100%" stop-color="#f0a91e" />
      </linearGradient>
    </defs>

    <!-- soft ground shadow -->
    <ellipse class="ground" cx="60" cy="110" rx="24" ry="4.5" fill="#000" opacity="0.1" />

    <!-- arms: simple rounded stubs -->
    <g class="arm arm-l"><rect x="20" y="60" width="14" height="7" rx="3.5" fill="#f0a91e" /></g>
    <g class="arm arm-r"><rect x="86" y="60" width="14" height="7" rx="3.5" fill="#f0a91e" /></g>

    <!-- coin body: one clean circle -->
    <circle cx="60" cy="60" r="38" fill="url(#rupi-body)" />

    <!-- face -->
    <g class="face" fill="#3a2a08">
      <circle class="eye eye-l" cx="49" cy="55" r="4" />
      <circle class="eye eye-r" cx="71" cy="55" r="4" />
      <path class="mouth" d="M50 68 Q60 77 70 68" stroke="#3a2a08" stroke-width="3.4" stroke-linecap="round" fill="none" />
    </g>
    <!-- blink lids -->
    <g class="lids">
      <rect class="lid lid-l" x="44" y="50" width="10" height="6" rx="3" fill="url(#rupi-body)" />
      <rect class="lid lid-r" x="66" y="50" width="10" height="6" rx="3" fill="url(#rupi-body)" />
    </g>
  </svg>
</div>
