<div
  class="intro"
  [class.entered]="entered"
  [class.calc-phase]="phase === 'calc'"
  [style.--hue]="hue"
>
  <button class="back" (click)="goBack()" aria-label="Back">←</button>

  <!-- The calculator — the real screen. ONE control: the slider. -->
  <div class="panel">
    <span class="calc-label">{{ cfg.inputLabel }}</span>

    <!-- Big value (tap to type an exact figure) -->
    <div class="value">
      <span class="pfx" *ngIf="cfg.inputPrefix">{{ cfg.inputPrefix }}</span>
      <input
        class="value-input"
        inputmode="numeric"
        [value]="inputDisplay"
        (input)="onInputText($any($event.target).value)"
        [attr.aria-label]="cfg.inputLabel"
      />
      <span class="sfx" *ngIf="cfg.inputSuffix">{{ cfg.inputSuffix }}</span>
    </div>

    <!-- The slider: the single way to adjust -->
    <input
      type="range"
      class="slider"
      min="0"
      [max]="TRACK"
      step="1"
      [value]="sliderPos"
      (input)="onSlide($any($event.target).value)"
      [style.--frac]="sliderFrac"
    />

    <span class="rule">{{ cfg.ruleText }}</span>

    <div class="result">
      <span class="r-label">You'll aim to save</span>
      <div class="r-amount" [class.pop]="popKey % 2 === 0" [class.pop2]="popKey % 2 === 1">{{ compactInr(recommended) }}</div>
    </div>
  </div>

  <button class="cta" (click)="continue()">Continue →</button>

  <!-- ===== The "why this fund" welcome — the reasons + a button to enter ===== -->
  <div class="welcome" *ngIf="phase === 'why'" [class.leaving]="whyLeaving">
    <div class="welcome-inner">
      <h1 class="welcome-title" [class.show]="whyShown">{{ detail.title }}</h1>

      <div class="welcome-points">
        <div class="wpt" *ngFor="let p of detail.points; let i = index"
             [class.show]="whyShown" [style.transition-delay.ms]="200 + i * 160">
          <span class="wpt-icon">
            <svg viewBox="0 0 24 24" width="24" height="24">
              <ng-container [ngSwitch]="p.icon">
                <g *ngSwitchCase="'shield'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3l7 3v5c0 5-3.5 8.5-7 10-3.5-1.5-7-5-7-10V6z"/><path d="M9 12l2 2 4-4"/></g>
                <g *ngSwitchCase="'water'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M12 3s6 6.5 6 11a6 6 0 0 1-12 0c0-4.5 6-11 6-11z"/></g>
                <g *ngSwitchCase="'calm'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M8 13a4 4 0 0 0 8 0"/><path d="M9 9h.01M15 9h.01"/></g>
                <g *ngSwitchCase="'growth'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><path d="M4 19h16M6 19v-6M11 19V9M16 19v-9"/><path d="M4 9l5-3 5 2 6-5"/></g>
                <g *ngSwitchCase="'clock'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 7v5l3 2"/></g>
                <g *ngSwitchCase="'coins'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><ellipse cx="12" cy="6" rx="7" ry="3"/><path d="M5 6v6c0 1.7 3.1 3 7 3s7-1.3 7-3V6M5 12v6c0 1.7 3.1 3 7 3s7-1.3 7-3v-6"/></g>
                <g *ngSwitchCase="'target'" fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><circle cx="12" cy="12" r="5"/><circle cx="12" cy="12" r="1"/></g>
                <g *ngSwitchDefault fill="none" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" stroke-linejoin="round"><circle cx="12" cy="12" r="9"/><path d="M12 8v4M12 16h.01"/></g>
              </ng-container>
            </svg>
          </span>
          <span class="wpt-text">{{ p.text }}</span>
        </div>
      </div>

      <button class="welcome-cta" [class.show]="ctaShown" (click)="reveal()">
        {{ ctaLabel }}
        <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
    </div>
  </div>
</div>
