<div class="amount-screen">
  <!-- Ambient background -->
  <div class="bg" aria-hidden="true">
    <span class="halo"></span>
  </div>

  <!-- Top bar -->
  <header class="top">
    <button class="icon-btn" (click)="goBack()" aria-label="Back">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
    <div class="goal-chip">
      <span class="g-emoji">{{ goal.icon }}</span>
      <span class="g-label">{{ goal.label }}</span>
    </div>
    <button class="icon-btn" (click)="toggleMute()" [attr.aria-label]="muted ? 'Unmute' : 'Mute'">
      <svg *ngIf="!muted" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M16 8a4 4 0 0 1 0 8" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
      <svg *ngIf="muted" viewBox="0 0 24 24" width="20" height="20"><path d="M4 9v6h4l5 4V5L8 9H4z" fill="currentColor"/><path d="M17 9l4 6M21 9l-4 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <h1 class="prompt">Please choose a goal amount</h1>
  <p class="sub">Drag the dial, or tap a suggestion. You can fine-tune the exact figure any time.</p>

  <!-- ===================== The circular knob ===================== -->
  <div class="knob-wrap" [class.dragging]="false">
    <div
      class="dial"
      #dial
      (pointerdown)="startDrag($event)"
      role="slider"
      [attr.aria-valuemin]="min"
      [attr.aria-valuemax]="max"
      [attr.aria-valuenow]="amount"
      [attr.aria-label]="'Goal amount for ' + goal.label"
    >
      <svg viewBox="0 0 100 100" class="dial-svg">
        <defs>
          <linearGradient id="arcGrad" x1="0" y1="0" x2="1" y2="1">
            <stop offset="0%" stop-color="var(--accent)"/>
            <stop offset="100%" stop-color="var(--hy)"/>
          </linearGradient>
          <filter id="glow" x="-50%" y="-50%" width="200%" height="200%">
            <feGaussianBlur stdDeviation="1.4" result="b"/>
            <feMerge><feMergeNode in="b"/><feMergeNode in="SourceGraphic"/></feMerge>
          </filter>
        </defs>

        <!-- Tick marks around the gauge -->
        <g class="ticks">
          <line *ngFor="let t of [].constructor(28); let i = index"
                [attr.transform]="'rotate(' + (START + i * (SWEEP / 27)) + ' 50 50)'"
                x1="50" y1="6" x2="50" y2="10" />
        </g>

        <!-- Track -->
        <circle class="track" cx="50" cy="50" r="42"
                [attr.transform]="'rotate(' + (START - 90) + ' 50 50)'"
                stroke-dasharray="197.9 65.9" />
        <!-- Progress arc -->
        <circle class="arc" cx="50" cy="50" r="42"
                [attr.transform]="'rotate(' + (START - 90) + ' 50 50)'"
                [attr.stroke-dasharray]="dashArray"
                stroke="url(#arcGrad)" filter="url(#glow)" />

        <!-- Handle -->
        <circle class="handle-halo" [attr.cx]="handle.x" [attr.cy]="handle.y" r="7" />
        <circle class="handle" [attr.cx]="handle.x" [attr.cy]="handle.y" r="4.2" />
      </svg>

      <!-- Center readout -->
      <div class="readout">
        <div class="big" [class.pop]="true">{{ compact }}</div>
        <div class="full">{{ full }}</div>
      </div>
    </div>

    <!-- Fine nudge controls -->
    <div class="nudge">
      <button (click)="nudge(-1)" aria-label="Decrease">−</button>
      <span class="range-hint">{{ compactInr(min) }} — {{ compactInr(max) }}</span>
      <button (click)="nudge(1)" aria-label="Increase">+</button>
    </div>
  </div>

  <!-- Suggested amount chips -->
  <div class="chips">
    <button
      *ngFor="let s of goal.suggested_amounts"
      class="chip"
      [class.active]="amount === s"
      (click)="pickSuggested(s)"
    >{{ compactInr(s) }}</button>
  </div>

  <!-- Actions -->
  <div class="actions">
    <button class="enter-btn" (click)="openDialer()">
      <svg viewBox="0 0 24 24" width="16" height="16"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.6"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.6" stroke-linecap="round"/></svg>
      Enter amount
    </button>
    <button class="continue" (click)="confirm()">
      Continue with {{ compact }}
      <svg viewBox="0 0 24 24" width="18" height="18"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
    </button>
  </div>

  <!-- ===================== Numeric dialer overlay ===================== -->
  <div class="dialer-backdrop" *ngIf="dialerOpen" (click)="closeDialer(false)"></div>
  <div class="dialer" [class.open]="dialerOpen" *ngIf="dialerOpen">
    <div class="dialer-head">
      <button class="icon-btn" (click)="closeDialer(false)" aria-label="Back to dial">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span>Enter exact amount</span>
      <span class="spacer"></span>
    </div>

    <div class="dialer-display">
      <span class="cur">₹</span>{{ dialerDisplay }}
    </div>

    <div class="keypad">
      <button *ngFor="let k of ['1','2','3','4','5','6','7','8','9']" (click)="pressKey(k)">{{ k }}</button>
      <button (click)="pressKey('000')" class="wide">000</button>
      <button (click)="pressKey('0')">0</button>
      <button (click)="pressKey('back')" class="back" aria-label="Delete">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6h11v12H9l-6-6 6-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="dialer-done" (click)="closeDialer(true)">Set amount</button>
  </div>
</div>
