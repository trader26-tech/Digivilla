<div class="nav-chart">
  <div class="nc-controls">
    <div class="nc-windows">
      <button
        *ngFor="let w of windows"
        [class.active]="active() === w.window"
        (click)="setWindow(w.window)"
      >
        {{ label(w.window) }}
      </button>
    </div>
    <div class="nc-summary" *ngIf="current as c">
      <span class="nc-change" [class]="changeClass(c.change_pct)">{{ fmtPct(c.change_pct) }}</span>
      <span class="nc-cagr" *ngIf="c.cagr_pct !== null">· {{ c.cagr_pct.toFixed(1) }}% CAGR</span>
    </div>
  </div>

  <div class="nc-plot" *ngIf="!loading && linePath()">
    <svg [attr.viewBox]="'0 0 ' + W + ' ' + H" preserveAspectRatio="none" class="svg">
      <defs>
        <linearGradient [attr.id]="'ncg'" x1="0" y1="0" x2="0" y2="1">
          <stop offset="0%" [attr.stop-color]="color" stop-opacity="0.22" />
          <stop offset="100%" [attr.stop-color]="color" stop-opacity="0" />
        </linearGradient>
      </defs>
      <path [attr.d]="areaPath()" fill="url(#ncg)" />
      <path
        [attr.d]="linePath()"
        fill="none"
        [attr.stroke]="color"
        stroke-width="2"
        vector-effect="non-scaling-stroke"
      />
    </svg>
  </div>

  <div class="nc-loading" *ngIf="loading">Loading…</div>
  <div class="nc-empty" *ngIf="!loading && !linePath()">No data.</div>

  <div class="nc-foot" *ngIf="current as c">
    <span>L ₹{{ c.low?.toFixed(2) }}</span>
    <span>₹{{ c.start_nav?.toFixed(2) }} → ₹{{ c.end_nav?.toFixed(2) }}</span>
    <span>H ₹{{ c.high?.toFixed(2) }}</span>
  </div>
</div>
