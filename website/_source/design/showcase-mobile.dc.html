<!DOCTYPE html>
<html>
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
</head>
<body>
<x-dc>
<helmet>
<style>
/* ── PAGE 2 · APP SHOWCASE (phones) — ported from mobile-site.html ──────────────────────────
   A 100svh black page: kicker, "Real estate, / rebuilt as an app.", a serif 01/05 counter, a
   rail of five phones in perspective (the centred one upright and bright, the neighbours turned
   away and peeking in from the sides), the active phone's caption and an Apple-style page
   control. The rail plays by itself — every 3.6 s the next phone slides in from the right —
   and rests for a while after the visitor touches it; a sideways swipe steps it by hand, a
   vertical swipe (the page pager) too. Dimming is an overlay, not a CSS filter. */
.msh{position:relative;box-sizing:border-box;width:100%;max-width:100%;height:100vh;height:100svh;height:var(--pvh,100svh);background:#000;display:flex;flex-direction:column;color:#ececf1;overflow:hidden;font-family:Almarai,-apple-system,'Segoe UI',sans-serif;-webkit-font-smoothing:antialiased;scroll-snap-align:start;scroll-snap-stop:always}
.msh-grid{position:absolute;inset:0;pointer-events:none;opacity:.5;background-image:linear-gradient(rgba(233,233,237,.045) 1px,transparent 1px),linear-gradient(90deg,rgba(233,233,237,.045) 1px,transparent 1px);background-size:36px 36px;-webkit-mask-image:radial-gradient(ellipse 60% 45% at 50% 50%,#000 20%,transparent 100%);mask-image:radial-gradient(ellipse 60% 45% at 50% 50%,#000 20%,transparent 100%)}
.msh-glowp{position:absolute;left:50%;top:50%;width:120%;aspect-ratio:1;transform:translate(-50%,-50%);pointer-events:none;background:radial-gradient(closest-side,rgba(127,114,224,.22),rgba(127,114,224,.05) 50%,transparent)}
.msh-head{position:relative;z-index:2;padding:max(44px,env(safe-area-inset-top)) 24px 0;display:flex;justify-content:space-between;align-items:flex-end;gap:16px}
.msh-k{display:flex;align-items:center;gap:10px;font-size:11px;letter-spacing:.32em;text-transform:uppercase;color:#7a7c8c}
.msh-k i{width:6px;height:6px;border-radius:50%;background:#8fd65a;box-shadow:0 0 10px #8fd65a}
.msh h2{margin:12px 0 0;font-size:clamp(30px,9.5vw,40px);font-weight:800;line-height:1.02;letter-spacing:-.045em}
.msh h2>span{color:#7a7c8c}
.msh-counter{flex:none;display:flex;align-items:baseline;gap:4px;font-family:'Instrument Serif',serif;font-style:italic;font-size:48px;line-height:1;color:#ececf1;transition:opacity .25s}
.msh-counter small{font-family:Almarai,sans-serif;font-style:normal;font-size:12px;letter-spacing:.2em;color:#7a7c8c}
.msh-rail{position:relative;z-index:2;flex:1;min-height:0;overflow:hidden;perspective:1200px;perspective-origin:50% 50%;touch-action:none}
.msh-slide{position:absolute;left:50%;top:50%;width:72%;height:100%;transform:translate(-50%,-50%);display:grid;place-items:center;padding:14px 0;transition:transform .85s cubic-bezier(.22,.8,.2,1),opacity .6s;will-change:transform;transform-style:preserve-3d}
.msh-phone{position:relative;height:100%;max-height:600px;max-width:100%;aspect-ratio:360/759}
.msh-phone .dim{transition:opacity .6s}
.msh-phone .bezel{position:absolute;inset:0;border-radius:15%/7%;padding:3.2%;background:linear-gradient(160deg,#a8aab1 0%,#3a3b41 10%,#141518 30%,#0a0a0c 60%,#2b2c31 85%,#8e9097 100%);box-shadow:inset 0 0 0 1.5px rgba(255,255,255,.26),inset 0 0 0 4px #050506,0 50px 90px -30px rgba(0,0,0,1),0 0 90px -20px rgba(127,114,224,.25)}
.msh-phone .screen{position:relative;width:100%;height:100%;border-radius:13%/6%;overflow:hidden;background:#161826}
.msh-phone .screen img{display:block;width:100%;height:100%;object-fit:cover}
.msh-phone .island{position:absolute;left:50%;top:1.6%;width:30%;height:3.8%;transform:translateX(-50%);border-radius:999px;background:#000}
.msh-phone .sheen{position:absolute;inset:0;background:linear-gradient(120deg,rgba(255,255,255,.10),transparent 30%,transparent 70%,rgba(255,255,255,.04))}
.msh-phone .dim{position:absolute;inset:0;background:#000;opacity:0;pointer-events:none}
.msh-foot{position:relative;z-index:2;padding:0 24px max(22px,env(safe-area-inset-bottom));display:flex;flex-direction:column;gap:18px}
.msh-cap{display:flex;flex-direction:column;gap:6px;min-height:72px;transition:opacity .25s}
.msh-cap b{font-size:24px;font-weight:800;letter-spacing:-.04em;color:#ececf1}.msh-cap>span{font-size:15px;line-height:1.4;color:#a3a5b4;text-wrap:pretty}
.msh-bars{display:flex;align-items:center;gap:10px}
.msh-dots{flex:1;display:flex;align-items:center;gap:7px}
.msh-dot{position:relative;width:7px;height:7px;border-radius:999px;background:rgba(236,236,241,.26);overflow:hidden;transition:width .45s cubic-bezier(.2,.8,.2,1),background .3s}
.msh-dot.done{background:rgba(143,214,90,.42)}
.msh-dot.on{width:28px;background:rgba(236,236,241,.2)}
.msh-dot i{position:absolute;inset:0;border-radius:999px;background:#8fd65a;transform-origin:0 50%;transform:scaleX(0)}
.msh-bars>span{font-size:11px;letter-spacing:.26em;text-transform:uppercase;color:#7a7c8c;white-space:nowrap}
@media (prefers-reduced-motion:reduce){.msh-slide,.msh-dot{transition:none}}
</style>
</helmet>
<section ref="{{ rootRef }}" id="showcase" class="msh" data-screen-label="App showcase (phone)">
<div class="msh-grid"></div><div class="msh-glowp"></div>
<div class="msh-head">
<div><span class="msh-k"><i></i>The DigiVilla app</span><h2>Real estate,<br><span>rebuilt as an app.</span></h2></div>
<div ref="{{ counterRef }}" class="msh-counter"><span>{{ cnum }}</span><small>/05</small></div>
</div>
<div ref="{{ railRef }}" class="msh-rail" aria-label="App screens">
<sc-for list="{{ slides }}" as="s" hint-placeholder-count="5">
<div class="msh-slide"><div class="msh-phone"><div class="bezel"><div class="screen"><img src="{{ s.src }}" alt="{{ s.alt }}" loading="lazy" decoding="async"><div class="island"></div><div class="sheen"></div><div class="dim"></div></div></div></div></div>
</sc-for>
</div>
<div class="msh-foot">
<div ref="{{ capRef }}" class="msh-cap"><b>{{ capTitle }}</b><span>{{ capText }}</span></div>
<div class="msh-bars"><div ref="{{ dotsRef }}" class="msh-dots" role="tablist" aria-label="App screens"><sc-for list="{{ bars }}" as="b" hint-placeholder-count="5"><button class="{{ b.cls }}" onClick="{{ b.pick }}" role="tab" aria-label="{{ b.label }}" style="border:0;padding:0;cursor:pointer"><i></i></button></sc-for></div><span>Swipe ↑</span></div>
</div>
</section>
</x-dc>
<script type="text/x-dc" data-dc-script>
const SLIDES = [
  ['assets/screens/home.webp', 'Home', 'Your estate, one glance', 'Value and this month’s rent on one screen.'],
  ['assets/screens/villa.webp', 'Villa detail', 'Inside every villa', 'What each villa holds, and what it pays.'],
  ['assets/screens/compare.webp', 'Compare', 'Compare anything', 'FD, flat or villa — same money, side by side.'],
  ['assets/screens/next.webp', 'Next villa', 'Next villa, dated', 'Your SIP tells you when the next one lands.'],
  ['assets/screens/fd.webp', 'FD vs DigiVilla', 'FD, side by side', 'What the bank pays vs what the city pays.'],
];
const INTERVAL = 3600, REST = 7000;          // ms per phone when playing by itself; pause after a touch
class Component extends DCLogic {
  state = { active: 0 };
  railRef = React.createRef(); capRef = React.createRef(); counterRef = React.createRef(); rootRef = React.createRef(); dotsRef = React.createRef();
  /** place the five phones for `active`: the active one upright and bright, the neighbours turned away either side */
  layout(active) {
    const rail = this.railRef.current; if (!rail) return;
    [...rail.querySelectorAll('.msh-slide')].forEach((sl, i) => {
      const d = i - active, ad = Math.min(1.2, Math.abs(d));
      sl.style.transform = 'translate(calc(-50% + ' + (d * 80) + '%), -50%) rotateY(' + (d * -24).toFixed(1) + 'deg) translateZ(' + (-ad * 160).toFixed(0) + 'px) scale(' + (1 - ad * .1).toFixed(3) + ')';
      sl.style.opacity = Math.abs(d) > 1.5 ? 0 : 1; sl.style.zIndex = Math.round(10 - ad * 5);
      const dim = sl.querySelector('.dim'); if (dim) dim.style.opacity = (ad * .55).toFixed(3);
    });
  }
  go(to, byUser) {
    const cap = this.capRef.current, cnt = this.counterRef.current, now = performance.now();
    this.busy = true; this.slideAt = now; if (byUser) this.lastUser = now;
    this.layout(to);
    if (cap) cap.style.opacity = 0; if (cnt) cnt.style.opacity = 0;
    setTimeout(() => this.setState({ active: to }, () => { if (cap) cap.style.opacity = 1; if (cnt) cnt.style.opacity = 1; }), 200);
    setTimeout(() => { this.busy = false; }, 800);
  }
  componentDidMount() {
    const root = this.rootRef.current, rail = this.railRef.current;
    this.slideAt = performance.now(); this.lastUser = -1e9; this.visible = false; this.touching = false;
    if (root) {
      // the page pager asks the showcase first: a vertical swipe steps to the next / previous phone until the ends
      root.__step = dir => { if (this.busy) return true; const to = this.state.active + dir; if (to < 0 || to > SLIDES.length - 1) return false; this.go(to, true); return true; };
      root.__enter = dir => { const to = dir > 0 ? 0 : SLIDES.length - 1; if (to !== this.state.active) { this.layout(to); this.setState({ active: to }); } this.slideAt = performance.now(); };
      if ('IntersectionObserver' in window) { this.io = new IntersectionObserver(es => { this.visible = es[0].intersectionRatio >= .6; if (this.visible) this.slideAt = performance.now(); }, { threshold: [0, .6, 1] }); this.io.observe(root); }
      else this.visible = true;
    }
    if (rail) {
      // a sideways swipe on the phones steps them by hand (finger left = next)
      let x0 = 0, y0 = 0, done = false;
      rail.addEventListener('touchstart', e => { this.touching = true; done = false; x0 = e.touches[0].clientX; y0 = e.touches[0].clientY; }, { passive: true });
      rail.addEventListener('touchmove', e => {
        if (done) return; const dx = e.touches[0].clientX - x0, dy = e.touches[0].clientY - y0;
        if (Math.abs(dx) > 36 && Math.abs(dx) > Math.abs(dy) * 1.2) { done = true; const to = this.state.active + (dx < 0 ? 1 : -1); if (to >= 0 && to < SLIDES.length && !this.busy) this.go(to, true); }
      }, { passive: true });
      const up = () => { this.touching = false; this.lastUser = performance.now(); };
      rail.addEventListener('touchend', up, { passive: true }); rail.addEventListener('touchcancel', up, { passive: true });
    }
    this.onResize = () => this.layout(this.state.active); addEventListener('resize', this.onResize);
    requestAnimationFrame(() => this.layout(this.state.active)); setTimeout(() => this.layout(this.state.active), 300);
    // the player: fills the active pill over INTERVAL, then slides to the next phone (round and round) — only while the
    // showcase is on screen, nobody is touching it, and the visitor hasn't stepped it by hand in the last REST ms
    const rm = matchMedia('(prefers-reduced-motion: reduce)').matches;
    const tick = now => {
      const dots = this.dotsRef.current, on = dots && dots.querySelector('.on i');
      const playing = this.visible && !this.touching && !this.busy && !document.hidden && now - this.lastUser > REST && !rm;
      if (!playing) this.slideAt = now - (this.slideAt > now ? 0 : Math.min(now - this.slideAt, INTERVAL * .999));   // hold the fill where it is
      const u = Math.min(1, (now - this.slideAt) / INTERVAL);
      if (on) { const v = 'scaleX(' + u.toFixed(3) + ')'; if (on.__v !== v) { on.style.transform = v; on.__v = v; } }
      if (playing && u >= 1) this.go((this.state.active + 1) % SLIDES.length, false);
      this.raf = requestAnimationFrame(tick);
    };
    this.raf = requestAnimationFrame(tick);
  }
  componentWillUnmount() { removeEventListener('resize', this.onResize); cancelAnimationFrame(this.raf); if (this.io) this.io.disconnect(); }
  renderVals() {
    const a = this.state.active;
    return {
      railRef: this.railRef, capRef: this.capRef, counterRef: this.counterRef, rootRef: this.rootRef, dotsRef: this.dotsRef,
      slides: SLIDES.map(([src, alt]) => ({ src, alt })),
      cnum: String(a + 1).padStart(2, '0'), capTitle: SLIDES[a][2], capText: SLIDES[a][3],
      bars: SLIDES.map(([, alt], i) => ({ cls: 'msh-dot' + (i === a ? ' on' : i < a ? ' done' : ''), label: alt, pick: () => { if (i !== this.state.active && !this.busy) this.go(i, true); } })),
    };
  }
}
</script>
</body>
</html>
