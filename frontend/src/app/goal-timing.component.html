<div class="screen" [class.entered]="entered" [style.--hue]="hue">
  <button class="back" (click)="goBack()" aria-label="Back">←</button>

  <h1 class="title">When do you want<br />to reach it?</h1>

  <!-- Calendar-style date card -->
  <div class="cal">
    <div class="cal-top">
      <span class="cal-dot"></span><span class="cal-dot"></span>
      <span class="cal-label">Target date</span>
    </div>
    <div class="cal-body">
      <span class="cal-month">{{ targetMonthShort }}</span>
      <span class="cal-year">{{ targetYear }}</span>
    </div>
    <div class="cal-foot">{{ durationLabel }} from now</div>
  </div>

  <!-- Slider -->
  <div class="slider-wrap">
    <input
      type="range"
      class="slider"
      [min]="minMonths"
      [max]="maxMonths"
      step="1"
      [value]="months"
      (input)="onSlide($any($event.target).value)"
      [style.--frac]="frac"
    />
    <div class="ticks">
      <span *ngFor="let p of presets" class="tick" [class.on]="isActive(p.months)" (click)="pick(p.months)">{{ p.label }}</span>
    </div>
  </div>

  <button class="cta" (click)="confirm()">Continue →</button>
</div>
