<script>
(() => {
  const wrap = document.getElementById('wrap'), stage = document.getElementById('stage'), cta = document.getElementById('cta'), label = document.getElementById('label');
  // fit the 1080 × 1920 poster to any screen, centred
  const fit = () => { const W = wrap.clientWidth, H = wrap.clientHeight, k = Math.min(W / 1080, H / 1920);
    stage.style.transform = 'scale(' + k + ')'; stage.style.left = (W - 1080 * k) / 2 + 'px'; stage.style.top = (H - 1920 * k) / 2 + 'px'; };
  fit(); addEventListener('resize', fit); if (window.visualViewport) visualViewport.addEventListener('resize', fit);

  // one tap joins: the button, or anywhere on the poster (same tab — that's what opens the WhatsApp app on phones)
  const join = () => { cta.classList.add('pressed'); label.textContent = 'Opening WhatsApp…'; try { navigator.vibrate && navigator.vibrate(10); } catch (e) {}
    setTimeout(() => { cta.classList.remove('pressed'); label.textContent = 'Join on WhatsApp'; }, 2500); };
  cta.addEventListener('click', join);
  stage.addEventListener('click', e => { if (e.target.closest('a')) return; join(); location.href = cta.href; });
  // back from WhatsApp (bfcache): reset the label
  addEventListener('pageshow', () => { cta.classList.remove('pressed'); label.textContent = 'Join on WhatsApp'; });

  // idle motion: the villa floats, the coin bobs and spins (still for anyone who asks for less motion)
  if (!matchMedia('(prefers-reduced-motion: reduce)').matches) {
    const v = document.getElementById('villa'), c = document.getElementById('coin'), t0 = performance.now();
    const loop = t => { const k = (t - t0) / 1000;
      v.style.transform = 'translateY(' + (Math.sin(k * .7) * 7).toFixed(2) + 'px)';
      c.style.transform = 'translateY(' + (Math.sin(k * 1.4) * 9).toFixed(2) + 'px) rotateY(' + ((k * 70) % 360).toFixed(1) + 'deg)';
      if (!document.hidden) requestAnimationFrame(loop); else document.addEventListener('visibilitychange', () => requestAnimationFrame(loop), { once: true }); };
    requestAnimationFrame(loop);
  }
})();
</script>
