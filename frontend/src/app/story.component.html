<section class="hero">
  <!-- ambient background -->
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="grid"></span>
  </div>

  <div class="inner">
    <!-- animated growth visual: bars rise, a line draws up, a coin lifts -->
    <div class="viz" aria-hidden="true">
      <svg viewBox="0 0 320 200" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="hero-bar" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#7aa2ff" />
            <stop offset="100%" stop-color="#3f6fe6" />
          </linearGradient>
          <linearGradient id="hero-line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#2f9c6e" />
            <stop offset="100%" stop-color="#16c47f" />
          </linearGradient>
          <linearGradient id="hero-area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16c47f" stop-opacity="0.28" />
            <stop offset="100%" stop-color="#16c47f" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="hero-coin" cx="38%" cy="30%" r="75%">
            <stop offset="0" stop-color="#ffe08a" />
            <stop offset="100%" stop-color="#f0b429" />
          </radialGradient>
        </defs>

        <!-- baseline -->
        <line x1="20" y1="170" x2="300" y2="170" stroke="#c9d4ea" stroke-width="2" stroke-linecap="round" />

        <!-- growing bars -->
        <g class="bars">
          <rect class="bar" x="46"  y="120" width="26" height="50"  rx="6" fill="url(#hero-bar)" style="--h:50px" />
          <rect class="bar" x="92"  y="98"  width="26" height="72"  rx="6" fill="url(#hero-bar)" style="--h:72px" />
          <rect class="bar" x="138" y="112" width="26" height="58"  rx="6" fill="url(#hero-bar)" style="--h:58px" />
          <rect class="bar" x="184" y="76"  width="26" height="94"  rx="6" fill="url(#hero-bar)" style="--h:94px" />
          <rect class="bar" x="230" y="48"  width="26" height="122" rx="6" fill="url(#hero-bar)" style="--h:122px" />
        </g>

        <!-- rising trend line + soft area -->
        <path class="area" d="M33 150 L79 138 L125 128 L171 104 L217 74 L263 40 L263 170 L33 170 Z" fill="url(#hero-area)" />
        <path class="line" d="M33 150 L79 138 L125 128 L171 104 L217 74 L263 40" fill="none" stroke="url(#hero-line)" stroke-width="4" stroke-linecap="round" stroke-linejoin="round" />

        <!-- coin riding the top of the trend -->
        <g class="coin">
          <circle cx="263" cy="40" r="16" fill="url(#hero-coin)" />
          <text x="263" y="41" text-anchor="middle" dominant-baseline="central" font-family="'Inter',system-ui,sans-serif" font-weight="800" font-size="16" fill="#a9720c">₹</text>
        </g>
      </svg>
    </div>

    <h1 class="headline">
      Watch your money <span class="accent">grow.</span>
    </h1>
    <p class="sub">Pick a goal. We build the plan.</p>

    <button class="cta" (click)="start()" type="button">
      Get started
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
  </div>
</section>
