<section class="hero" [class.go]="revealed">
  <!-- ambient background -->
  <div class="ambient" aria-hidden="true">
    <span class="blob b1"></span>
    <span class="blob b2"></span>
    <span class="grid"></span>
  </div>

  <div class="inner">
    <span class="eyebrow">The cost of waiting</span>
    <h1 class="headline">Your money,<br /><span class="accent">working harder.</span></h1>

    <!-- THE GAP: idle savings vs invested-with-us -->
    <div class="chart" aria-hidden="true">
      <svg viewBox="0 0 360 210" preserveAspectRatio="xMidYMid meet">
        <defs>
          <linearGradient id="inv-line" x1="0" y1="0" x2="1" y2="0">
            <stop offset="0" stop-color="#12a150" /><stop offset="1" stop-color="#16c47f" />
          </linearGradient>
          <linearGradient id="inv-area" x1="0" y1="0" x2="0" y2="1">
            <stop offset="0" stop-color="#16c47f" stop-opacity="0.30" />
            <stop offset="1" stop-color="#16c47f" stop-opacity="0" />
          </linearGradient>
          <radialGradient id="inv-coin" cx="38%" cy="30%" r="75%">
            <stop offset="0" stop-color="#ffe08a" /><stop offset="1" stop-color="#f0b429" />
          </radialGradient>
        </defs>

        <!-- baseline -->
        <line x1="16" y1="180" x2="344" y2="180" stroke="#d3ddf0" stroke-width="2" stroke-linecap="round" />

        <!-- invested-with-us: soaring area + line -->
        <path class="inv-area" d="M20 168 C120 158 210 120 340 26 L340 180 L20 180 Z" fill="url(#inv-area)" />
        <path class="inv-line" d="M20 168 C120 158 210 120 340 26" fill="none" stroke="url(#inv-line)" stroke-width="5" stroke-linecap="round" />
        <g class="coin">
          <circle cx="340" cy="26" r="15" fill="url(#inv-coin)" />
          <text x="340" y="27" text-anchor="middle" dominant-baseline="central" font-family="'Inter',system-ui,sans-serif" font-weight="800" font-size="15" fill="#a9720c">₹</text>
        </g>

        <!-- idle savings: nearly flat, dashed & grey -->
        <path class="save-line" d="M20 168 C120 166 220 162 340 156" fill="none" stroke="#9aa7bd" stroke-width="4" stroke-linecap="round" stroke-dasharray="2 8" />
        <circle class="save-dot" cx="340" cy="156" r="6" fill="#9aa7bd" />
      </svg>

      <!-- racing counters -->
      <div class="tallies">
        <div class="tally invested">
          <span class="t-val">{{ inr(invested) }}</span>
          <span class="t-lbl"><i class="dot g"></i>Invested with us</span>
        </div>
        <div class="tally saved">
          <span class="t-val">{{ inr(saved) }}</span>
          <span class="t-lbl"><i class="dot n"></i>Left in savings</span>
        </div>
      </div>
    </div>

    <p class="punch">Same ₹10,000 a month. <b>{{ multiple }}× more</b> over 20 years.</p>

    <button class="cta" (click)="start()" type="button">
      Start growing
      <svg viewBox="0 0 24 24" fill="none"><path d="M5 12h14M13 6l6 6-6 6" stroke="currentColor" stroke-width="2.4" stroke-linecap="round" stroke-linejoin="round" /></svg>
    </button>
    <span class="fineprint">Illustrative, based on long-run category assumptions.</span>
  </div>
</section>
