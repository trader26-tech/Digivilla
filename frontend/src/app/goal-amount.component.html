<div class="screen" [class.entered]="entered" [style.--hue]="hue">
  <button class="back" (click)="goBack()" aria-label="Back">←</button>

  <h1 class="title">How much for<br />{{ goalPhrase }}?</h1>

  <!-- Big live amount. Tapping it opens the phone's number keyboard (optional). -->
  <div class="amount-box">
    <div class="type-wrap" *ngIf="typing">
      <span class="type-cur">₹</span>
      <input
        #amountInput
        class="type-input"
        type="text"
        inputmode="numeric"
        [ngModel]="typedDisplay"
        (ngModelChange)="onTyped($event)"
        (blur)="commitTyped()"
        (keydown.enter)="commitTyped()"
        aria-label="Enter goal amount"
      />
    </div>
    <button
      *ngIf="!typing"
      class="big"
      [class.pop]="popKey % 2 === 0"
      [class.pop2]="popKey % 2 === 1"
      (click)="startTyping()"
    >{{ full }}</button>
    <span class="sub" *ngIf="!typing">{{ compact }} · tap to type</span>
    <button class="done-btn" *ngIf="typing" (click)="commitTyped()">Done</button>
  </div>

  <!-- Slider — the primary control, matched to the timing screen. -->
  <div class="slider-wrap">
    <input
      type="range"
      class="slider"
      min="0"
      [max]="TRACK"
      step="1"
      [value]="pos"
      (input)="onSlide($any($event.target).value)"
      [style.--frac]="sliderFrac"
    />
    <div class="ticks">
      <span
        *ngFor="let p of presetChips"
        class="tick"
        [class.on]="isTickActive(p)"
        (click)="pickAmount(p)"
      >{{ compactInr(p) }}</span>
    </div>
  </div>

  <button class="cta" (click)="confirm()" [disabled]="cheering">Continue →</button>

  <!-- ===================== Motivating hand-off ===================== -->
  <div class="cheer" *ngIf="cheering">
    <div class="cheer-card">
      <div class="cheer-ring">
        <svg viewBox="0 0 52 52" width="56" height="56">
          <circle class="cr-track" cx="26" cy="26" r="23" />
          <circle class="cr-fill" cx="26" cy="26" r="23"
                  [attr.stroke]="'hsl(' + hue + ' 80% 50%)'" />
          <path class="cr-check" d="M17 27l6 6 12-13" [attr.stroke]="'hsl(' + hue + ' 80% 45%)'" />
        </svg>
      </div>
      <div class="cheer-amount">{{ full }}</div>
      <h2 class="cheer-title">{{ cheerTitle }}</h2>
      <p class="cheer-body">{{ cheerBody }}</p>
      <div class="cheer-dots"><span></span><span></span><span></span></div>
    </div>
  </div>
</div>
