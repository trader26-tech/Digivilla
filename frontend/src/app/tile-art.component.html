<!-- soil side (left + right faces for depth) -->
<path class="soil-l" [attr.d]="'M' + (cx - TILE_W/2) + ',' + cy + ' L' + cx + ',' + (cy + TILE_H/2) + ' L' + cx + ',' + (cy + TILE_H/2 + 12) + ' L' + (cx - TILE_W/2) + ',' + (cy + 12) + ' Z'" />
<path class="soil-r" [attr.d]="'M' + cx + ',' + (cy + TILE_H/2) + ' L' + (cx + TILE_W/2) + ',' + cy + ' L' + (cx + TILE_W/2) + ',' + (cy + 12) + ' L' + cx + ',' + (cy + TILE_H/2 + 12) + ' Z'" />
<!-- lawn top -->
<path class="lawn" [attr.d]="diamond(cx, cy)" />

<!-- LAND: a bare parcel. -->
<ng-container *ngIf="tile.type === 'land'"></ng-container>
