<main class="xp" [class.embedded]="embedded"
      (pointerdown)="onDown($event)" (pointerup)="onUp($event)" (pointercancel)="onUp($event)"
      (wheel)="onWheel($event)">

  <button class="xp-back" *ngIf="!embedded" (click)="onBack()" aria-label="Back">‹</button>

  <!-- vertical dots: which asset you're on -->
  <div class="xp-dots" role="tablist" aria-label="Assets for sale">
    <button class="xp-dot" *ngFor="let it of items; let i = index"
            [class.on]="index() === i" (click)="goTo(i)" [attr.aria-label]="it.name"></button>
  </div>

  <!-- the stack: each card fills the screen, only the active one is shown -->
  <div class="xp-stack">
    <section class="xp-card" *ngFor="let it of items; let i = index"
             [class.on]="index() === i" [class.up]="i < index()">

      <!-- top: name + price + rent -->
      <header class="xp-head">
        <b class="xp-name">{{ it.name }}</b>
        <div class="xp-figs">
          <div class="xp-fig">
            <b class="xp-fig-v">{{ compact(it.price) }}</b>
            <span class="xp-fig-k">to buy</span>
          </div>
          <div class="xp-fig right">
            <b class="xp-fig-v rent">{{ it.rent }}</b>
            <span class="xp-fig-k">{{ it.rentK }}</span>
          </div>
        </div>
      </header>

      <!-- CENTREPIECE: the asset image, centred exactly like the home map, with
           a small FOR SALE board -->
      <div class="xp-art">
        <span class="xp-sale">FOR SALE</span>
        <app-villa-art *ngIf="it.kind === 'villa'"></app-villa-art>
        <app-land-art *ngIf="it.kind === 'land'"></app-land-art>
      </div>

      <!-- one-word eVilla vs real villa -->
      <div class="xp-cmp">
        <div class="xp-cmp-head">
          <span></span>
          <span class="xp-cmp-ours">eVilla</span>
          <span class="xp-cmp-theirs">Real villa</span>
        </div>
        <div class="xp-cmp-row" *ngFor="let c of it.compare">
          <span class="xp-cmp-k">{{ c.label }}</span>
          <span class="xp-cmp-ours">{{ c.ours }}</span>
          <span class="xp-cmp-theirs">{{ c.theirs }}</span>
        </div>
      </div>

      <!-- buy -->
      <button class="xp-buy" (click)="buy(it.kind)">
        Buy {{ it.name }}
        <svg viewBox="0 0 24 24" width="18" height="18" aria-hidden="true"><path d="M5 12h14M13 6l6 6-6 6" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>

      <span class="xp-swipe" *ngIf="i < items.length - 1" aria-hidden="true">Swipe up for more ↑</span>
    </section>
  </div>
</main>
