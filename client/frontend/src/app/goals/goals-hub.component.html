<div class="scr">
  <div class="warm"></div>
  <div class="col hub">
    <div class="hdr">
      <button class="back" type="button" aria-label="Back to home" (click)="back.emit()">
        <svg width="15" height="15" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M15 6l-6 6 6 6"></path></svg>
      </button>
      <span class="ttl">What your villas <i>pay for</i></span>
    </div>

    <!-- A · Monthly payout -->
    <div class="slot a1">
      <app-goals-card-payout></app-goals-card-payout>
      <button class="hit" type="button" aria-label="Open monthly payout" (click)="open.emit('payout')"></button>
    </div>

    <!-- B · Homecoming -->
    <div class="slot a2">
      <div class="hc">
        <i class="ring" aria-hidden="true"></i>
        <svg viewBox="0 26 362 240" preserveAspectRatio="xMidYMid slice" class="sky">
          <defs>
            <linearGradient id="hcSky" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#7d95cf"></stop><stop offset=".3" stop-color="#b5abc4"></stop><stop offset=".55" stop-color="#ecc29a"></stop><stop offset=".72" stop-color="#f7bf78"></stop><stop offset="1" stop-color="#e79a5e"></stop></linearGradient>
            <radialGradient id="hcSun" cx="50%" cy="50%" r="50%"><stop offset="0" stop-color="#ffe6b0"></stop><stop offset=".45" stop-color="#f6b06a" stop-opacity=".7"></stop><stop offset="1" stop-color="#f08a4a" stop-opacity="0"></stop></radialGradient>
            <linearGradient id="hcTrail" gradientUnits="userSpaceOnUse" x1="100" y1="0" x2="190" y2="0"><stop offset="0" stop-color="#fff" stop-opacity="0"></stop><stop offset=".55" stop-color="#fff" stop-opacity=".55"></stop><stop offset="1" stop-color="#fff" stop-opacity=".9"></stop></linearGradient>
            <linearGradient id="hpF" x1="0" y1="-1" x2="0" y2="1" gradientUnits="objectBoundingBox"><stop offset="0" stop-color="#ffffff"></stop><stop offset=".6" stop-color="#f1effa"></stop><stop offset="1" stop-color="#c9c3ea"></stop></linearGradient>
            <linearGradient id="hpWu" x1="0" y1="1" x2="0" y2="0"><stop offset="0" stop-color="#ffffff"></stop><stop offset="1" stop-color="#e4e0f6"></stop></linearGradient>
            <linearGradient id="hpWd" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#e2def4"></stop><stop offset="1" stop-color="#bdb6e2"></stop></linearGradient>
          </defs>
          <rect y="0" width="362" height="270" fill="url(#hcSky)"></rect>
          <ellipse cx="200" cy="168" rx="150" ry="46" fill="url(#hcSun)" opacity=".55"></ellipse>
          <path d="M100 126 Q181 62 268 112" fill="none" stroke="rgba(255,255,255,.3)" stroke-width="1" stroke-dasharray="1.5 4" stroke-linecap="round"></path>
          <path d="M100 126 Q146 90 174 87.5" fill="none" stroke="url(#hcTrail)" stroke-width="1.6" stroke-linecap="round"></path>
          <g transform="translate(194,86) rotate(6) scale(1.05)" class="plane-sh">
            <g class="plane">
              <path d="M5 -2 L-8 -16.5 L-11 -16.5 L-4.5 -2 Z" fill="url(#hpWu)"></path>
              <path d="M5 2 L-8 16.5 L-11 16.5 L-4.5 2 Z" fill="url(#hpWd)"></path>
              <rect x="-2.6" y="-8.4" width="6" height="2.4" rx="1.2" fill="#d6d1f0"></rect>
              <rect x="-2.6" y="6" width="6" height="2.4" rx="1.2" fill="#b8b0e0"></rect>
              <path d="M-14 -2 L-18.6 -7.6 L-20.4 -7.6 L-17.6 -2 Z" fill="url(#hpWu)"></path>
              <path d="M-14 2 L-18.6 7.6 L-20.4 7.6 L-17.6 2 Z" fill="url(#hpWd)"></path>
              <path d="M20 0 C20 -1.4 18 -2.3 15 -2.3 L-15 -2.1 C-18 -2.1 -19.6 -1 -19.6 0 C-19.6 1 -18 2.1 -15 2.1 L15 2.3 C18 2.3 20 1.4 20 0 Z" fill="url(#hpF)"></path>
              <path d="M-17 -.9 L17 -1" stroke="#fff" stroke-width=".7" stroke-linecap="round"></path>
              <path d="M17.2 -1.3 Q19.4 0 17.2 1.3" fill="none" stroke="#5b5196" stroke-width="1" stroke-linecap="round"></path>
            </g>
          </g>
        </svg>
        <img class="burj" src="assets/goals/burj.png" alt="">
        <div class="gate">
          <img src="assets/goals/india-gate.png" alt="India Gate">
          <span class="gate-lbl">INDIA</span>
        </div>
        <div class="fade"></div>
        <div class="rule"></div>
        <div class="tag">
          <span class="tag-n">01</span>
          <span class="tag-l"></span>
          <span class="tag-t">Package</span>
        </div>
        <div class="foot">
          <div class="row">
            <div class="lft">
              <span class="h">Home<span class="h-i">coming</span></span>
              <span class="sub">Dubai to India, every year</span>
            </div>
            <div class="rgt">
              <b class="amt">{{ cardAmt() }}</b>
              <span class="nxt">a year</span>
            </div>
          </div>
        </div>
      </div>
      <button class="hit" type="button" aria-label="Plan Homecoming" (click)="openSheet()"></button>
    </div>

    <!-- C · Your own goal -->
    <div class="slot a3">
      <app-goals-card-custom></app-goals-card-custom>
      <button class="hit" type="button" aria-label="Create your own goal" (click)="open.emit('create')"></button>
    </div>

    <!-- saved custom goals, newest first -->
    @for (g of goals.custom(); track g.id) {
      <div class="slot a3">
        <app-goals-card-custom [goal]="g" (remove)="removeGoal($event)"></app-goals-card-custom>
      </div>
    }
  </div>
</div>

<!-- Homecoming: what does the trip cost? -->
<dialog #sheetEl class="ovl" aria-label="What does the trip cost?" (cancel)="closeSheet()">
  @if (sheet()) {
    <div class="bd" (click)="closeSheet()"></div>
    <div class="sheet">
      <i class="handle"></i>
      <div class="sh-hd">
        <span class="sh-ttl">What does the trip <i>cost</i>?</span>
        <span class="sh-sub">Flights, outings, shopping, travel — for a whole year</span>
      </div>
      <label class="field" [class.on]="val()">
        <span class="rs">₹</span>
        <input [value]="valTxt()" (input)="onInput($event)" inputmode="numeric" placeholder="1,50,000" aria-label="Trip cost a year">
        <span class="per">a year</span>
      </label>
      <div class="chips">
        @for (c of chips; track c.n) {
          <button type="button" class="chip" [class.on]="val() === c.n" (click)="pick(c.n)">{{ c.t }}</button>
        }
      </div>
      <button type="button" class="cta" [disabled]="!val()" (click)="go()">Continue to checkout</button>
      <div class="or"><i></i>not sure?<i></i></div>
      <button type="button" class="est" (click)="estimate()">
        <span class="bars"><i class="b1"></i><i class="b2"></i><i class="b3"></i><i class="b4"></i></span>
        <span class="est-t">
          <span class="est-h">Estimate it for me</span>
          <span class="est-s">Build it from the 4 parts · about 2 min</span>
        </span>
        <svg width="16" height="16" viewBox="0 0 24 24" fill="none" stroke="#f3c77a" stroke-width="2.2" stroke-linecap="round" stroke-linejoin="round"><path d="M9 6l6 6-6 6"></path></svg>
      </button>
    </div>
  }
</dialog>
