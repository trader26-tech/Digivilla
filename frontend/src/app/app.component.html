<!-- Cinematic welcome, every launch, before everything -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- Onboarding is just: intro -> "what this platform is" info + phone/OTP login.
     After OTP, the user lands straight on the Home dashboard. No goal flow here;
     goals are created from Home via the "+ New" button. -->
<app-welcome-gate
  *ngIf="!intro && !authed"
  (getStarted)="onGateStart()"
  (loggedIn)="onGateLogin($event)"
></app-welcome-gate>

<!-- Authed dashboard shell. Shows for ANY logged-in user — including a
     returning user (token in localStorage) or one who logged in via the gate,
     where pickedGoal is false. (Was `pickedGoal && authed`, which left an
     authed-but-no-goal user on a blank screen.) -->
<ng-container *ngIf="authed && !intro">
<div class="shell">
  <div class="main-col">
    <app-home
      [refreshKey]="goalsVersion"
      [userName]="userName"
      (planNew)="startAddGoal()"
      (openGoal)="openGoalDetail($event)"
      (signOut)="signOut()"
    ></app-home>
  </div>
</div>

<!-- Full-screen detail for a single tapped goal. -->
<div class="goal-detail-overlay" *ngIf="selectedGoal">
  <app-goal-detail
    [goal]="selectedGoal"
    (back)="closeGoalDetail()"
  ></app-goal-detail>
</div>

<!-- Add-goal: the SAME onboarding flow (picker -> amount -> timing -> plan),
     opened full-screen when the signed-in user taps "+ New goal". -->
<div class="add-goal-overlay" *ngIf="addingGoal" [@stepAnim]="addStep">
  <button class="add-goal-close" (click)="cancelAddGoal()" aria-label="Cancel">✕</button>

  <app-goal-picker
    *ngIf="!chosenGoal"
    (goalChosen)="onGoalChosen($event)"
  ></app-goal-picker>

  <app-goal-intro
    *ngIf="chosenGoal && !amountDone"
    [goal]="chosenGoal"
    (amountReady)="onAmountChosen($event)"
    (back)="onAmountBack()"
  ></app-goal-intro>

  <app-goal-timing
    *ngIf="chosenGoal && amountDone && !timingDone"
    [goal]="chosenGoal"
    [amount]="chosenAmount"
    (timingChosen)="onTimingChosen($event)"
    (back)="onTimingBack()"
  ></app-goal-timing>

  <app-goal-result
    *ngIf="chosenGoal && timingDone"
    [goal]="chosenGoal"
    [amount]="chosenAmount"
    [years]="chosenYears"
    (continued)="onResultContinue($event)"
    (back)="onResultBack()"
  ></app-goal-result>
</div>
</ng-container>

<!-- Always-on "refresh to latest" button — force-clears the PWA cache so the
     newest deploy always loads. Floats above every screen. -->
<app-refresh-button></app-refresh-button>

<!-- DEV: floating "Jump" menu to hop straight to any screen with sample data. -->
<app-dev-nav (jump)="jumpTo($event)"></app-dev-nav>
