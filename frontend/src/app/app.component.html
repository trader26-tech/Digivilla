<!-- Opening animation, plays first — before login. -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- GATE: after the intro, nothing renders until the phone is verified. -->
<app-login *ngIf="!intro && !auth.signedIn()" (done)="onLoggedIn()"></app-login>

<ng-container *ngIf="!intro && auth.signedIn()">
<!-- HOME: the isometric estate — the user's own map. Shown right after intro. -->
<app-estate-home
  *ngIf="!intro && detail === null && villa === null && land === null && construction === null && buildFlow === null && !accountOpen && view === 'home'"
  (openTile)="openTile($event)"
  (explore)="openStorefront()"
  (build)="openBuild()"
  (account)="openAccount()"
></app-estate-home>

<!-- ACCOUNT: profile + transactions, from the home avatar. -->
<app-account
  *ngIf="!intro && accountOpen"
  (back)="closeAccount()"
></app-account>

<!-- BUILD A NEW ASSET: pick villa or land. -->
<app-build-picker
  *ngIf="!intro && buildFlow === 'pick'"
  (pick)="pickBuild($event)"
  (back)="closeBuild()"
></app-build-picker>

<!-- Villa buy page (from the pick screen). -->
<app-villa-buy
  *ngIf="!intro && buildFlow === 'villa'"
  (back)="closeBuild()"
></app-villa-buy>

<!-- Land buy page (from the pick screen). -->
<app-land-buy
  *ngIf="!intro && buildFlow === 'land'"
  (back)="closeBuild()"
></app-land-buy>

<!-- The storefront (Explore): the four property tiers to browse/buy. -->
<app-storefront
  *ngIf="!intro && detail === null && villa === null && land === null && construction === null && view === 'storefront'"
  (openProperty)="openProperty($event)"
  (back)="backToHome()"
></app-storefront>

<!-- A villa tapped on the estate -> its dedicated detail page. -->
<app-villa-detail
  *ngIf="!intro && villa"
  [price]="villa.cost"
  [name]="villa.label"
  [boughtAt]="villa.boughtAt"
  (back)="closeVilla()"
></app-villa-detail>

<!-- A land plot tapped on the estate -> its dedicated detail page (mirrors villa). -->
<app-land-page
  *ngIf="!intro && land"
  [tileId]="land.id"
  [price]="land.cost"
  [name]="land.label"
  [boughtAt]="land.boughtAt"
  (converted)="closeLand()"
  (back)="closeLand()"
></app-land-page>

<!-- An under-construction tile tapped -> its dedicated build-detail page. -->
<app-construction-detail
  *ngIf="!intro && construction"
  [cost]="construction.cost"
  [sipMonthly]="construction.sipMonthly"
  [sipAccrued]="construction.sipAccrued"
  [name]="construction.label"
  [boughtAt]="construction.boughtAt"
  (back)="closeConstruction()"
></app-construction-detail>

<!-- Land bought from the storefront keeps the buy/projection page. -->
<app-land-detail
  *ngIf="!intro && !land && detail && detail.property === 'land'"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-land-detail>

<!-- Flat / Apartment / Duplex — income-tier detail page (Land template +
     monthly-income bucket mechanics + tax note; no Monte Carlo). -->
<app-estate-detail
  *ngIf="!intro && detail && detail.property !== 'land'"
  [property]="detail.property"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-estate-detail>
</ng-container>
