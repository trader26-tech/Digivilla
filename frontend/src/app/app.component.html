<!-- Opening animation, plays once on launch. -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- The storefront: the four property tiers. -->
<app-storefront
  *ngIf="!intro && detail === null"
  (openProperty)="openProperty($event)"
></app-storefront>

<!-- Risk × Reward map — a dedicated page (any tile's risk label opens this). -->
<app-risk-map
  *ngIf="!intro && detail && detail.focus === 'map'"
  [property]="detail.property"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
  (openDetail)="openFromMap($event)"
></app-risk-map>

<!-- Land keeps its own dedicated detail page. -->
<app-land-detail
  *ngIf="!intro && detail && detail.focus !== 'map' && detail.property === 'land'"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-land-detail>

<!-- Flat / Apartment / Duplex use the generic property-detail page. -->
<app-property-detail
  *ngIf="!intro && detail && detail.focus !== 'map' && detail.property !== 'land'"
  [property]="detail.property"
  [initialVariant]="detail.variant"
  [focus]="null"
  (back)="closeDetail()"
></app-property-detail>
