<div class="amount-screen">
  <!-- Top bar -->
  <header class="top">
    <div class="goal-chip">
      <span class="g-emoji">{{ goal.icon }}</span>
      <span class="g-label">{{ goal.label }}</span>
    </div>
    <button class="icon-btn" (click)="goBack()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <h1 class="prompt">Please choose a goal amount</h1>

  <!-- Big amount -->
  <div class="readout">
    <div class="big">{{ full }}</div>
    <div class="compact">{{ compact }}</div>
  </div>

  <!-- Enter amount pill -->
  <button class="enter-btn" (click)="openDialer()">
    <svg viewBox="0 0 24 24" width="15" height="15"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    Enter amount
  </button>

  <!-- ===================== The arch dial ===================== -->
  <div
    class="dial"
    #dial
    (pointerdown)="startDrag($event)"
    role="slider"
    [attr.aria-valuemin]="min"
    [attr.aria-valuemax]="max"
    [attr.aria-valuenow]="amount"
    [attr.aria-label]="'Goal amount for ' + goal.label"
  >
    <!-- viewBox is a wide, short band; the dial is a big circle whose TOP edge
         arcs across it. r=150, centre pushed well below the band so only the
         top cap shows as a dome. -->
    <svg viewBox="0 0 320 220" class="dial-svg" preserveAspectRatio="xMidYMin slice">
      <!-- The dome fill -->
      <circle class="dome" cx="160" cy="320" r="300" />

      <!-- Tick marks arced along the top edge of the dome -->
      <g class="ticks">
        <line *ngFor="let t of tickArr; let i = index"
              [attr.transform]="'rotate(' + tickAngle(i) + ' 160 320)'"
              x1="160" y1="20" x2="160" y2="30" />
      </g>

      <!-- Progress: the filled portion of the arc, from the left up to handle -->
      <path class="track" [attr.d]="arcPath(1)" />
      <path class="progress" [attr.d]="arcPath(fraction)" />

      <!-- Handle -->
      <circle class="handle-halo" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="14" />
      <circle class="handle" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="7" />
    </svg>

    <!-- Suggestion chips float over the dome -->
    <div class="chips">
      <button
        *ngFor="let s of goal.suggested_amounts"
        class="chip"
        [class.active]="amount === s"
        (click)="pickSuggested(s); $event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      >{{ compactInr(s) }}</button>
    </div>
  </div>

  <!-- Next -->
  <button class="next" (click)="confirm()">Next</button>

  <!-- ===================== Numeric dialer overlay ===================== -->
  <div class="dialer-backdrop" *ngIf="dialerOpen" (click)="closeDialer(false)"></div>
  <div class="dialer" [class.open]="dialerOpen" *ngIf="dialerOpen">
    <div class="dialer-head">
      <button class="icon-btn" (click)="closeDialer(false)" aria-label="Back to dial">
        <svg viewBox="0 0 24 24" width="20" height="20"><path d="M15 5l-7 7 7 7" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"/></svg>
      </button>
      <span>Enter exact amount</span>
      <span class="spacer"></span>
    </div>

    <div class="dialer-display">
      <span class="cur">₹</span>{{ dialerDisplay }}
    </div>

    <div class="keypad">
      <button *ngFor="let k of ['1','2','3','4','5','6','7','8','9']" (click)="pressKey(k)">{{ k }}</button>
      <button (click)="pressKey('000')" class="wide">000</button>
      <button (click)="pressKey('0')">0</button>
      <button (click)="pressKey('back')" class="back" aria-label="Delete">
        <svg viewBox="0 0 24 24" width="22" height="22"><path d="M9 6h11v12H9l-6-6 6-6z" fill="none" stroke="currentColor" stroke-width="1.7" stroke-linejoin="round"/><path d="M12 10l4 4M16 10l-4 4" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
      </button>
    </div>

    <button class="dialer-done" (click)="closeDialer(true)">Set amount</button>
  </div>
</div>
