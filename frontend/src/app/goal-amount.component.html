<div class="amount-screen" [class.entered]="entered" [style.--hue]="hue">
  <!-- Top bar: just a close button now; the goal name lives in the heading. -->
  <header class="top">
    <span class="spacer"></span>
    <button class="icon-btn" (click)="goBack()" aria-label="Close">
      <svg viewBox="0 0 24 24" width="20" height="20"><path d="M6 6l12 12M18 6L6 18" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round"/></svg>
    </button>
  </header>

  <h1 class="prompt reveal">
    How much do you want to save for<br />
    <span class="prompt-goal">{{ goalPhrase }}</span>?
  </h1>

  <!-- Big amount. Tapping it (or the pill) opens the phone's number keyboard. -->
  <div class="readout reveal">
    <!-- When typing, a real numeric input takes over so the OS keypad shows. -->
    <div class="type-wrap" *ngIf="typing">
      <span class="type-cur">₹</span>
      <input
        #amountInput
        class="type-input"
        type="text"
        inputmode="numeric"
        [ngModel]="typedDisplay"
        (ngModelChange)="onTyped($event)"
        (blur)="commitTyped()"
        (keydown.enter)="commitTyped()"
        aria-label="Enter goal amount"
      />
    </div>
    <div
      *ngIf="!typing"
      class="big"
      [class.pop]="popKey % 2 === 0"
      [class.pop2]="popKey % 2 === 1"
      (click)="startTyping()"
    >{{ full }}</div>
    <div class="compact" *ngIf="!typing">{{ compact }}</div>
  </div>

  <!-- Enter amount pill -->
  <button class="enter-btn reveal" *ngIf="!typing" (click)="startTyping()">
    <svg viewBox="0 0 24 24" width="15" height="15"><rect x="4" y="4" width="16" height="16" rx="3" fill="none" stroke="currentColor" stroke-width="1.7"/><path d="M8 9h8M8 13h5" stroke="currentColor" stroke-width="1.7" stroke-linecap="round"/></svg>
    Enter amount
  </button>
  <button class="enter-btn done reveal" *ngIf="typing" (click)="commitTyped()">Done</button>

  <!-- ===================== The arch dial ===================== -->
  <div
    class="dial"
    [class.dragging]="isDragging"
    #dial
    (pointerdown)="startDrag($event)"
    role="slider"
    [attr.aria-valuemin]="min"
    [attr.aria-valuemax]="max"
    [attr.aria-valuenow]="amount"
    [attr.aria-label]="'Goal amount for ' + goal.label"
  >
    <!-- viewBox is a wide, short band; the dial is a big circle whose TOP edge
         arcs across it, centre pushed below the band so only the top cap shows. -->
    <svg viewBox="0 0 320 220" class="dial-svg" preserveAspectRatio="xMidYMin slice">
      <defs>
        <!-- Colour gradient for the filled arc, in the goal's hue. -->
        <linearGradient id="arcFill" x1="0" y1="0" x2="1" y2="0">
          <stop offset="0%"   [attr.stop-color]="'hsl(' + hue + ' 82% 58%)'" />
          <stop offset="100%" [attr.stop-color]="'hsl(' + (hue + 20) + ' 80% 50%)'" />
        </linearGradient>
        <radialGradient id="domeGlow" cx="50%" cy="18%" r="80%">
          <stop offset="0%"  [attr.stop-color]="'hsl(' + hue + ' 70% 95%)'" />
          <stop offset="100%" [attr.stop-color]="'hsl(' + hue + ' 55% 99%)'" />
        </radialGradient>
      </defs>

      <!-- The dome fill: a soft tinted wash. -->
      <circle class="dome" cx="160" cy="320" r="300" fill="url(#domeGlow)" />

      <!-- Base track (faint, full arc) + coloured progress up to the handle. -->
      <path class="track" [attr.d]="arcPath(1)" />
      <path class="progress" [attr.d]="arcPath(fraction)" stroke="url(#arcFill)" />

      <!-- Handle: one clean dot with a thin coloured ring. -->
      <circle class="handle-ring" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="9"
              [attr.stroke]="'hsl(' + hue + ' 80% 50%)'" />
      <circle class="handle" [attr.cx]="handlePt.x" [attr.cy]="handlePt.y" r="6"
              [attr.fill]="'hsl(' + hue + ' 80% 50%)'" />
    </svg>

    <!-- Suggestion chips float over the dome -->
    <div class="chips reveal">
      <button
        *ngFor="let s of goal.suggested_amounts"
        class="chip"
        [class.active]="amount === s"
        (click)="pickSuggested(s); $event.stopPropagation()"
        (pointerdown)="$event.stopPropagation()"
      >{{ compactInr(s) }}</button>
    </div>
  </div>

  <!-- Next -->
  <button class="next reveal" (click)="confirm()" [disabled]="cheering">Next</button>

  <!-- ===================== Motivating hand-off ===================== -->
  <div class="cheer" *ngIf="cheering">
    <div class="cheer-card">
      <div class="cheer-ring">
        <svg viewBox="0 0 52 52" width="56" height="56">
          <circle class="cr-track" cx="26" cy="26" r="23" />
          <circle class="cr-fill" cx="26" cy="26" r="23"
                  [attr.stroke]="'hsl(' + hue + ' 80% 50%)'" />
          <path class="cr-check" d="M17 27l6 6 12-13" [attr.stroke]="'hsl(' + hue + ' 80% 45%)'" />
        </svg>
      </div>
      <div class="cheer-amount">{{ full }}</div>
      <h2 class="cheer-title">{{ cheerTitle }}</h2>
      <p class="cheer-body">{{ cheerBody }}</p>
      <div class="cheer-dots"><span></span><span></span><span></span></div>
    </div>
  </div>

</div>
