<!-- Opening animation, plays first — before login. -->
<app-intro *ngIf="intro" (done)="onIntroDone()"></app-intro>

<!-- GATE: after the intro, nothing renders until the phone is verified. Profile
     details are no longer collected here — the advisor sets that up on the
     first call, so a freshly-verified user drops straight into onboarding. -->
<app-login *ngIf="!intro && !auth.signedIn()" (done)="onLoggedIn()"></app-login>

<ng-container *ngIf="!intro && auth.signedIn()">
<!-- HOME: the ONE estate map — "[Name]'s City" — kept for every state. When the
     user has no villa yet it shows a dummy house + the upcoming setup call; as
     they progress the same map fills with their real villas. -->
<app-estate-home
  *ngIf="detail === null && villa === null && land === null && construction === null && buildFlow === null && !accountOpen && view === 'home'"
  class="has-nav"
  [justVerified]="justVerified"
  (openTile)="openTile($event)"
  (explore)="goExplore()"
  (build)="openBuild()"
  (account)="openAccount()"
  (refresh)="onEstateRefresh()"
></app-estate-home>

<!-- EXPLORE tab: swipeable villa tiers (dark, premium) + how-it-works. -->
<app-explore
  *ngIf="!intro && detail === null && villa === null && land === null && construction === null && buildFlow === null && !accountOpen && view === 'explore'"
  class="has-nav"
  (own)="ownVilla($event)"
  (back)="goHome()"
></app-explore>

<!-- CALLS tab: the user's scheduled fund-manager calls. -->
<app-calls
  *ngIf="!intro && detail === null && villa === null && land === null && construction === null && buildFlow === null && !accountOpen && view === 'calls'"
  class="has-nav"
  (signOut)="onSignOut()"
></app-calls>

<!-- BOTTOM NAV: a floating pill with three tabs — Home, Explore, Calls. -->
<nav class="tabbar" *ngIf="onTab">
  <div class="tabbar-pill">
    <button class="tab" [class.active]="view === 'home'" (click)="goHome()" aria-label="Home">
      <span class="tab-in">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M4 11l8-7 8 7M6 10v9h12v-9" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round" stroke-linecap="round"/></svg>
        <span class="tab-lbl">Home</span>
      </span>
    </button>
    <button class="tab" [class.active]="view === 'explore'" (click)="goExplore()" aria-label="Explore">
      <span class="tab-in">
        <svg viewBox="0 0 24 24" width="24" height="24"><circle cx="12" cy="12" r="9" fill="none" stroke="currentColor" stroke-width="1.9"/><path d="M15.5 8.5l-2 5-5 2 2-5z" fill="currentColor"/></svg>
        <span class="tab-lbl">Explore</span>
      </span>
    </button>
    <button class="tab" [class.active]="view === 'calls'" (click)="goCalls()" aria-label="Calls">
      <span class="tab-in">
        <svg viewBox="0 0 24 24" width="24" height="24"><path d="M6 3h3l2 5-2 1.5a11 11 0 0 0 5 5L18 12l3 2v3a2 2 0 0 1-2 2A16 16 0 0 1 4 6a2 2 0 0 1 2-3z" fill="none" stroke="currentColor" stroke-width="1.9" stroke-linejoin="round"/></svg>
        <span class="tab-lbl">Calls</span>
      </span>
    </button>
  </div>
</nav>

<!-- ACCOUNT: profile + transactions, from the home avatar. -->
<app-account
  *ngIf="!intro && accountOpen"
  (back)="closeAccount()"
  (signOut)="onSignOut()"
></app-account>

<!-- BUILD A NEW ASSET: pick villa or land. -->
<app-build-picker
  *ngIf="!intro && buildFlow === 'pick'"
  (pick)="pickBuild($event)"
  (back)="closeBuild()"
></app-build-picker>

<!-- Villa buy page (from the pick screen). -->
<app-villa-buy
  *ngIf="!intro && buildFlow === 'villa'"
  [startAmount]="buildAmount"
  (back)="closeBuild()"
></app-villa-buy>

<!-- Land buy page (from the pick screen). -->
<app-land-buy
  *ngIf="!intro && buildFlow === 'land'"
  (back)="closeBuild()"
></app-land-buy>

<!-- The storefront (Explore): the four property tiers to browse/buy. -->
<app-storefront
  *ngIf="!intro && detail === null && villa === null && land === null && construction === null && view === 'storefront'"
  (openProperty)="openProperty($event)"
  (back)="backToHome()"
></app-storefront>

<!-- A villa tapped on the estate -> its dedicated detail page. -->
<app-villa-detail
  *ngIf="!intro && villa"
  [price]="villa.cost"
  [name]="villa.label"
  [boughtAt]="villa.boughtAt"
  (back)="closeVilla()"
></app-villa-detail>

<!-- A land plot tapped on the estate -> its dedicated detail page (mirrors villa). -->
<app-land-page
  *ngIf="!intro && land"
  [tileId]="land.id"
  [price]="land.cost"
  [name]="land.label"
  [boughtAt]="land.boughtAt"
  (converted)="closeLand()"
  (back)="closeLand()"
></app-land-page>

<!-- An under-construction tile tapped -> its dedicated build-detail page. -->
<app-construction-detail
  *ngIf="!intro && construction"
  [holdingId]="construction.id"
  [cost]="construction.cost"
  [sipMonthly]="construction.sipMonthly"
  [sipAccrued]="construction.sipAccrued"
  [name]="construction.label"
  [boughtAt]="construction.boughtAt"
  (back)="closeConstruction()"
></app-construction-detail>

<!-- Land bought from the storefront keeps the buy/projection page. -->
<app-land-detail
  *ngIf="!intro && !land && detail && detail.property === 'land'"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-land-detail>

<!-- Flat / Apartment / Duplex — income-tier detail page (Land template +
     monthly-income bucket mechanics + tax note; no Monte Carlo). -->
<app-estate-detail
  *ngIf="!intro && detail && detail.property !== 'land'"
  [property]="detail.property"
  [initialVariant]="detail.variant"
  (back)="closeDetail()"
></app-estate-detail>
</ng-container>
